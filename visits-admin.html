
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>NICHA CRM | จัดการของรางวัลสะสมครั้ง</title>

<style>
:root{
  --green:#123d32;
  --green2:#28734b;
  --gold:#c9a65b;
  --cream:#f1f7f2;
  --text:#244333;
  --muted:#6d7d71;
  --red:#c64b4b;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
.container{
  max-width:850px;
  margin:25px auto;
  padding:18px;
}
.header{
  text-align:center;
  margin-bottom:22px;
}
.header h1{
  color:var(--green2);
  margin-bottom:5px;
  font-size:25px;
}
.header p{
  color:var(--muted);
  font-size:14px;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px #0000000c;
}
h2{
  font-size:19px;
  margin:0 0 16px;
  color:var(--green);
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbdccf;
  border-radius:9px;
  margin:7px 0 14px;
  font-size:16px;
  font-family:inherit;
}
textarea{
  min-height:85px;
  resize:vertical;
}
label{
  display:block;
  font-weight:bold;
  font-size:14px;
}
button{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  background:var(--green2);
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}
button.secondary{background:#64766a}
button.danger{background:var(--red)}
button.light{background:#e6f2e9;color:#24613d}
button.gold{background:var(--gold);color:white}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row button{flex:1}
.hidden{display:none!important}
.small{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}
#message{
  display:none;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  font-size:13px;
  white-space:pre-wrap;
}
.ok{background:#e2f5e8;color:#176b39}
.error{background:#ffebeb;color:#a52c2c}
.reward{
  border:1px solid #e0ebe2;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
}
.reward h3{
  margin:0 0 8px;
  color:var(--green);
  font-size:17px;
}
.reward p{
  margin:6px 0;
  font-size:14px;
  line-height:1.5;
}
.status{
  font-size:13px;
  font-weight:bold;
}
.active{color:#21834b}
.inactive{color:#c64b4b}
.reward-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:12px;
}
.reward-actions button{flex:1}
.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}
.badge{
  display:inline-block;
  background:#f7f0df;
  color:#92702d;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:8px;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>NICHA CRM</h1>
    <p>ระบบจัดการของรางวัลสะสมครั้ง</p>
  </div>

  <div id="adminPanel" class="hidden">

    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">จัดการของรางวัลสะสมครั้ง</h2>
        <button class="secondary" onclick="backToCenter()">กลับหน้ารวม</button>
      </div>

      <p class="small">
        ตั้งค่ารางวัลสำหรับสมาชิกที่มาใช้บริการสะสมครบตามจำนวนครั้ง
      </p>

      <div id="message"></div>

      <div class="row">
        <button onclick="newReward()">＋ เพิ่มของรางวัล</button>
        <button class="light" onclick="loadRewards()">รีเฟรชรายการ</button>
      </div>
    </div>

    <!-- FORM -->
    <div id="formCard" class="card hidden">
      <h2 id="formTitle">เพิ่มของรางวัลสะสมครั้ง</h2>

      <input type="hidden" id="rewardId">

      <label for="rewardVisits">จำนวนครั้งที่ต้องสะสม</label>
      <input
        id="rewardVisits"
        type="number"
        min="1"
        step="1"
        placeholder="เช่น 10"
      >

      <label for="rewardName">ชื่อของรางวัล</label>
      <input
        id="rewardName"
        type="text"
        maxlength="150"
        placeholder="เช่น นวดไทยฟรี 60 นาที"
      >

      <label for="rewardDescription">รายละเอียดของรางวัล</label>
      <textarea
        id="rewardDescription"
        maxlength="500"
        placeholder="รายละเอียดหรือเงื่อนไขการรับรางวัล"
      ></textarea>

      <label for="rewardStatus">สถานะ</label>
      <select id="rewardStatus">
        <option value="ใช้งาน">เปิดใช้งาน</option>
        <option value="ไม่ใช้งาน">ปิดใช้งาน</option>
      </select>

      <div class="row">
        <button id="saveBtn" onclick="saveReward()">บันทึก</button>
        <button class="secondary" onclick="closeForm()">ยกเลิก</button>
      </div>
    </div>

    <!-- LIST -->
    <div class="card">
      <h2>รายการของรางวัลทั้งหมด</h2>
      <div id="rewardList">กำลังโหลดรายการ...</div>
    </div>

    <div class="card">
      <p class="small">
        หมายเหตุ: หน้านี้ใช้สำหรับจัดการรายการของรางวัลสะสมครั้งเท่านั้น
        ไม่ใช่หน้าจัดการของรางวัลแลกแต้ม
      </p>
    </div>

  </div>
</div>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbyTicniXNgmKtRavQPXdaJa8FWU05-_alup6V4A6Ikm5B1rxMDs8Bv4cj5G6ywPt0Pu0Q/exec';

const SESSION_KEY = 'NICHA_STAFF_PIN';

let staffPin = '';
let rewards = [];

/* =========================
   SESSION INITIALIZATION
========================= */

function initializePage(){
  staffPin = sessionStorage.getItem(SESSION_KEY) || '';

  if(!/^\d{6}$/.test(staffPin)){
    window.top.location.href = 'staff-center.html';
    return;
  }

  document.getElementById('adminPanel').classList.remove('hidden');
  loadRewards();
}

/* =========================
   BACK TO CENTER
========================= */

function backToCenter(){
  if(window.parent && window.parent !== window &&
     typeof window.parent.backToMenu === 'function'){
    window.parent.backToMenu();
  }else{
    window.location.href = 'staff-center.html';
  }
}

/* =========================
   API
========================= */

async function api(action,data={}){
  const response = await fetch(API_URL,{
    method:'POST',
    headers:{
      'Content-Type':'text/plain;charset=utf-8'
    },
    body:JSON.stringify({
      ...data,
      action
    })
  });

  if(!response.ok){
    throw new Error('HTTP '+response.status);
  }

  return await response.json();
}

/* =========================
   MESSAGE
========================= */

function showMessage(message,isError=false){
  const box = document.getElementById('message');

  box.textContent = message;
  box.className = isError ? 'error' : 'ok';
  box.style.display = 'block';
}

/* =========================
   LOAD REWARDS
========================= */

async function loadRewards(){
  const list = document.getElementById('rewardList');

  list.textContent = 'กำลังโหลดรายการ...';

  try{
    const result = await api('getAllVisitRewards',{
      pin:staffPin
    });

    if(!result.success){
      list.textContent = result.message || 'โหลดรายการไม่สำเร็จ';
      return;
    }

    rewards = Array.isArray(result.rewards)
      ? result.rewards
      : [];

    renderRewards();

  }catch(error){
    list.textContent =
      'โหลดรายการไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อ';
  }
}

/* =========================
   RENDER
========================= */

function renderRewards(){
  const list = document.getElementById('rewardList');

  list.innerHTML = '';

  if(!rewards.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'ยังไม่มีของรางวัลสะสมครั้ง';
    list.appendChild(empty);
    return;
  }

  const sorted = [...rewards].sort((a,b)=>{
    return Number(a.visitsRequired || 0) -
           Number(b.visitsRequired || 0);
  });

  sorted.forEach(reward=>{
    const item = document.createElement('div');
    item.className = 'reward';

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent =
      'สะสมครบ '+(reward.visitsRequired || 0)+' ครั้ง';

    const title = document.createElement('h3');
    title.textContent = reward.name || 'ไม่มีชื่อรางวัล';

    const description = document.createElement('p');
    description.textContent =
      reward.description || 'ไม่มีรายละเอียด';

    const status = document.createElement('p');
    status.className = 'status ' +
      (reward.status === 'ใช้งาน' ? 'active' : 'inactive');

    status.textContent =
      'สถานะ: '+(reward.status || 'ไม่ระบุ');

    const actions = document.createElement('div');
    actions.className = 'reward-actions';

    const edit = document.createElement('button');
    edit.className = 'light';
    edit.textContent = 'แก้ไข';
    edit.onclick = ()=>editReward(reward.rewardId);

    const toggle = document.createElement('button');
    toggle.className = 'secondary';
    toggle.textContent =
      reward.status === 'ใช้งาน'
        ? 'ปิดใช้งาน'
        : 'เปิดใช้งาน';
    toggle.onclick = ()=>toggleReward(reward.rewardId);

    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'ลบ';
    del.onclick = ()=>deleteReward(reward.rewardId);

    actions.append(edit,toggle,del);
    item.append(badge,title,description,status,actions);
    list.appendChild(item);
  });
}

/* =========================
   NEW REWARD
========================= */

function newReward(){
  document.getElementById('formTitle').textContent =
    'เพิ่มของรางวัลสะสมครั้ง';

  document.getElementById('rewardId').value = '';
  document.getElementById('rewardVisits').value = '';
  document.getElementById('rewardName').value = '';
  document.getElementById('rewardDescription').value = '';
  document.getElementById('rewardStatus').value = 'ใช้งาน';

  document.getElementById('formCard').classList.remove('hidden');

  document.getElementById('formCard').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
}

/* =========================
   EDIT REWARD
========================= */

function editReward(rewardId){
  const reward = rewards.find(item=>
    String(item.rewardId) === String(rewardId)
  );

  if(!reward){
    showMessage('ไม่พบข้อมูลของรางวัล',true);
    return;
  }

  document.getElementById('formTitle').textContent =
    'แก้ไขของรางวัลสะสมครั้ง';

  document.getElementById('rewardId').value =
    reward.rewardId || '';

  document.getElementById('rewardVisits').value =
    reward.visitsRequired || '';

  document.getElementById('rewardName').value =
    reward.name || '';

  document.getElementById('rewardDescription').value =
    reward.description || '';

  document.getElementById('rewardStatus').value =
    reward.status || 'ใช้งาน';

  document.getElementById('formCard').classList.remove('hidden');

  document.getElementById('formCard').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
}

/* =========================
   CLOSE FORM
========================= */

function closeForm(){
  document.getElementById('formCard').classList.add('hidden');
}

/* =========================
   SAVE REWARD
========================= */

async function saveReward(){
  const rewardId =
    document.getElementById('rewardId').value.trim();

  const visitsRequired =
    Number(document.getElementById('rewardVisits').value);

  const name =
    document.getElementById('rewardName').value.trim();

  const description =
    document.getElementById('rewardDescription').value.trim();

  const status =
    document.getElementById('rewardStatus').value;

  if(!Number.isInteger(visitsRequired) || visitsRequired <= 0){
    showMessage('กรุณาระบุจำนวนครั้งสะสมให้ถูกต้อง',true);
    return;
  }

  if(!name){
    showMessage('กรุณากรอกชื่อของรางวัล',true);
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try{
    const action = rewardId
      ? 'editVisitReward'
      : 'addVisitReward';

    const data = {
      pin:staffPin,
      visitsRequired,
      name,
      description,
      status
    };

    if(rewardId){
      data.rewardId = rewardId;
    }

    const result = await api(action,data);

    if(!result.success){
      showMessage(
        result.message || 'บันทึกของรางวัลไม่สำเร็จ',
        true
      );
      return;
    }

    showMessage('บันทึกของรางวัลเรียบร้อยแล้ว');

    closeForm();
    await loadRewards();

  }catch(error){
    showMessage('เกิดข้อผิดพลาดในการบันทึก',true);
  }finally{
    btn.disabled = false;
    btn.textContent = 'บันทึก';
  }
}

/* =========================
   TOGGLE STATUS
========================= */

async function toggleReward(rewardId){
  const reward = rewards.find(item=>
    String(item.rewardId) === String(rewardId)
  );

  if(!reward) return;

  const newStatus =
    reward.status === 'ใช้งาน'
      ? 'ไม่ใช้งาน'
      : 'ใช้งาน';

  const actionText =
    newStatus === 'ใช้งาน'
      ? 'เปิดใช้งาน'
      : 'ปิดใช้งาน';

  if(!confirm('ต้องการ'+actionText+'รางวัลนี้หรือไม่?')){
    return;
  }

  try{
    const result = await api('editVisitReward',{
      pin:staffPin,
      rewardId:reward.rewardId,
      visitsRequired:reward.visitsRequired,
      name:reward.name,
      description:reward.description || '',
      status:newStatus
    });

    if(!result.success){
      showMessage(
        result.message || 'เปลี่ยนสถานะไม่สำเร็จ',
        true
      );
      return;
    }

    showMessage('เปลี่ยนสถานะเรียบร้อยแล้ว');
    await loadRewards();

  }catch(error){
    showMessage('เกิดข้อผิดพลาดในการเปลี่ยนสถานะ',true);
  }
}

/* =========================
   DELETE REWARD
========================= */

async function deleteReward(rewardId){
  const reward = rewards.find(item=>
    String(item.rewardId) === String(rewardId)
  );

  if(!reward) return;

  const confirmed = confirm(
    'ยืนยันลบรางวัล "'+reward.name+'" หรือไม่?\n\n'+
    'หากมีสมาชิกเคยแลกรางวัลนี้แล้ว แนะนำให้ปิดใช้งานแทนการลบ'
  );

  if(!confirmed) return;

  try{
    const result = await api('deleteVisitReward',{
      pin:staffPin,
      rewardId:reward.rewardId
    });

    if(!result.success){
      showMessage(
        result.message || 'ลบของรางวัลไม่สำเร็จ',
        true
      );
      return;
    }

    showMessage('ลบของรางวัลเรียบร้อยแล้ว');
    await loadRewards();

  }catch(error){
    showMessage('เกิดข้อผิดพลาดในการลบ',true);
  }
}

/* =========================
   START
========================= */

initializePage();
</script>

</body>
</html>
