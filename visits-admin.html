<style>

  --muted:#6d7d71;

}
*{box-sizing:border-box}
body{

}
.container{

}
.header{

  color:var(--green2);
  margin-bottom:5px;
  font-size:25px;
}
.header p{

}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px #0000000c;
}
h2{
  font-size:19px;
  margin:0 0 16px;
  color:var(--green);
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #cbdccf;
  border-radius:9px;
  margin:7px 0 14px;
  font-size:16px;
  font-family:inherit;
}
textarea{
  min-height:85px;
  resize:vertical;
}
label{
  display:block;
  font-weight:bold;
  font-size:14px;
}
button{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  background:var(--green2);
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}
button.secondary{background:#64766a}
button.danger{background:var(--red)}
button.light{background:#e6f2e9;color:#24613d}
button.gold{background:var(--gold);color:white}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row button{flex:1}
.hidden{display:none!important}
.small{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}
#message,#loginMessage{
  padding:10px;

  font-size:13px;

}
#message{display:none}
.ok{background:#e2f5e8;color:#176b39}
.error{background:#ffebeb;color:#a52c2c}
.reward{
  border:1px solid #e0ebe2;

  padding:16px;
  margin:12px 0;
}
.reward h3{
  margin:0 0 8px;
  color:var(--green);
  font-size:17px;
}
.reward p{
  margin:6px 0;
  font-size:14px;
  line-height:1.5;
}
.status{
  font-size:13px;
  font-weight:bold;
}
.active{color:#21834b}
.inactive{color:#c64b4b}
.reward-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:12px;
}
.reward-actions button{flex:1}
.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}
.badge{
  display:inline-block;
  background:#f7f0df;
  color:#92702d;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:8px;
}
</style>
</head>
