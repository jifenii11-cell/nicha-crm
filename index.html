<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8f4;color:#244b39;font-family:Arial,sans-serif}
header{background:#176b4b;color:white;text-align:center;padding:28px 15px;border-radius:0 0 25px 25px}
header h1{margin:0;font-size:25px;letter-spacing:2px}
header p{margin:8px 0 0;font-size:13px}
main{max-width:480px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 3px 14px #173f2610}
.member{background:linear-gradient(135deg,#176b4b,#369b70);color:white}
.small{font-size:13px;opacity:.85}
.points{font-size:42px;font-weight:bold;margin:8px 0}
.level{display:inline-block;background:#ffffff30;padding:7px 15px;border-radius:20px;font-size:13px}

.progress{height:9px;background:#e3eee7;border-radius:10px;overflow:hidden;margin:12px 0}

.history{padding:12px 0;border-bottom:1px solid #edf1ee;font-size:13px}
.muted{color:#7b9185;font-size:12px}

.hidden{display:none!important}
#status{text-align:center;padding:18px;color:#176b4b;font-size:14px}

/* ===== NICHA LUXURY SPA THEME ===== */

header {

h3 {

button {

.reward {

.notice {

}

/* ===== NICHA VIP MEMBER CARD ===== */
.member {
  position: relative;
  overflow: hidden;
  min-height: 300px;
  padding: 25px;
  border: 1px solid #d6b76c;
  border-radius: 22px;
  background:
    radial-gradient(circle at 90% 10%, #55765a 0%, transparent 38%),
    linear-gradient(135deg, #10291f, #1d4935 60%, #0d2119);
  color: #fff8e8;
  box-shadow: 0 14px 30px #142c2040;
}

.member::before {
  content: "";
  position: absolute;

  pointer-events: none;

.member-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;

}

.member-brand {

}

.member-subtitle {
  color: #d8c89f;
  font-size: 10px;

  margin-top: 3px;
}

.member-card-label {
  color: #e8d19a;

  letter-spacing: 1px;
  border: 1px solid #c8a967;

}

.member-card-name {
  position: relative;
  z-index: 1;
  color: #fff8e9;

  font-weight: bold;
  margin-top: 28px;
  margin-bottom: 12px;
}

  z-index: 1;
}

  display: inline-block;
  background: linear-gradient(135deg, #f2dfae, #b9914e);
  color: #263b2b;
  font-weight: bold;
  padding: 7px 18px;
  border-radius: 20px;
}

.member-points-label {
  color: #dfd0aa;
  font-size: 11px;
  letter-spacing: 2px;

}

.member .points {
  color: #f3d99b;
  font-size: 48px;
  font-weight: bold;
  margin: 3px 0 0;
}

.member-points-unit {
  color: #d8c89f;
  font-size: 10px;
  letter-spacing: 2px;
}

.member #nextLevel {
  color: #e7dcc0;
  margin-top: 14px;
}

.member .progress {
  background: #ffffff25;
  height: 6px;
  margin-top: 10px;
}

.member .bar {
  background: linear-gradient(90deg, #c49a4d, #f8e7b5);

</style>
</head>
<body>

<header>
<h1>NICHA CRM</h1>
<p>MEMBER REWARDS PROGRAM</p>
</header>

<main>
<div id="status">กำลังเริ่มต้นระบบสมาชิก...</div>

<!-- สมัครสมาชิก / เพิ่มเบอร์โทร -->
<div id="registerArea" class="card hidden">
<h3 id="formTitle">สมัครสมาชิก NICHA</h3>
<div class="notice" id="formMessage">
กรุณากรอกชื่อและเบอร์โทรศัพท์เพื่อสมัครสมาชิก
</div>

<label>ชื่อสมาชิก</label>
<input id="inputName" type="text" placeholder="กรอกชื่อของคุณ">

<label>เบอร์โทรศัพท์</label>
<input id="inputPhone" type="tel" inputmode="numeric"
maxlength="10" placeholder="ตัวอย่าง 0812345678">

<button class="full" id="registerBtn" onclick="submitRegistration()">
ยืนยันข้อมูลสมาชิก
</button>
<p id="formError" class="muted"></p>
</div>

<!-- บัตรสมาชิก -->
<div id="memberArea" class="hidden">


<div class="card member">
  <div class="member-card-top">
    <div>
      <div class="member-brand">NICHA</div>
      <div class="member-subtitle">LUXURY SPA</div>
    </div>
    <div class="member-card-label">✦ VIP MEMBER</div>
  </div>

  <div class="member-card-name" id="memberName">สมาชิก</div>

  <div class="member-tier">
    <span class="level" id="level">Bronze</span>
  </div>

  <div class="member-points-label">POINT BALANCE</div>
  <div class="points" id="points">0</div>
  <div class="member-points-unit">POINTS</div>

  <p class="small" id="nextLevel"></p>

  <div class="progress">
    <div class="bar" id="progressBar"></div>
  </div>

  <div class="member-card-footer">
    <span>NICHA HEALTH MASSAGE</span>
    <span>VIP PRIVILEGE</span>
  </div>
</div>
 </div> 
</main>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwoJMHW6PWqh7OHwmyo8_YpJB5LJfVp5ZDYdRTNJstNklfYYRmQc_YDYr1I0Vw3_XTw/exec';
const LIFF_ID='2012451889-JlA6fHip';

let lineUserId='';
let profileName='สมาชิก NICHA';

function api(action,params={}){
  return new Promise((resolve,reject)=>{
    const callback='nichaCallback'+Date.now()+Math.floor(Math.random()*1000);
    const script=document.createElement('script');
    const query=new URLSearchParams({action,...params,callback});

    window[callback]=data=>{
      resolve(data);
      delete window[callback];
      script.remove();
    };

    script.onerror=()=>{
      reject(new Error('เชื่อมต่อ API ไม่สำเร็จ'));
      delete window[callback];
      script.remove();
    };

    script.src=API_URL+'?'+query.toString();
    document.body.appendChild(script);

    setTimeout(()=>{
      if(window[callback]){
        delete window[callback];
        script.remove();
        reject(new Error('ระบบตอบกลับช้า กรุณาลองใหม่'));
      }
    },15000);
  });
}

function showStatus(message){
  const el=document.getElementById('status');
  el.innerText=message;
  el.classList.remove('hidden');
}

function hideStatus(){
  document.getElementById('status').classList.add('hidden');
}


async function start(){
  try {
    showStatus('กำลังเชื่อมต่อ LINE...');

    // ตรวจสอบว่า LIFF SDK โหลดสำเร็จหรือไม่
    if (typeof window.liff === 'undefined' || !window.liff) {
      throw new Error('ไม่พบ LINE LIFF SDK กรุณาตรวจสอบอินเทอร์เน็ต');
    }

    // เริ่มต้น LIFF
    await window.liff.init({
      liffId: LIFF_ID
    });

    // ตรวจสอบสถานะเข้าสู่ระบบ
    if (!window.liff.isLoggedIn()) {
      window.liff.login();
      return;
    }

    // ดึงข้อมูลสมาชิก LINE
    const profile = await window.liff.getProfile();

    if (!profile || !profile.userId) {
      throw new Error('ไม่สามารถอ่านข้อมูล LINE ได้');
    }

    lineUserId = profile.userId;
    profileName = profile.displayName || 'สมาชิก NICHA';

    // ตรวจสอบสมาชิกในฐานข้อมูล
    const result = await api('getMember', {
      lineUserId: lineUserId
    });

    if (!result || !result.success) {
      throw new Error(
        result && result.message
          ? result.message
          : 'ตรวจสอบข้อมูลสมาชิกไม่สำเร็จ'
      );
    }

    if (result.member) {
      const member = result.member;

      if (!member.phone) {
        showRegistration(member.name || profileName, true);
        return;
      }

      await enterMember(member);
      return;
    }

    showRegistration(profileName, false);

  } catch (err) {
    console.error('NICHA CRM ERROR:', err);

    showStatus(
      'เชื่อมต่อไม่สำเร็จ: ' +
      (err && err.message ? err.message : String(err))
    );
  }
}

function showRegistration(name,isExisting){
  hideStatus();

  document.getElementById('memberArea').classList.add('hidden');
  document.getElementById('registerArea').classList.remove('hidden');

  document.getElementById('inputName').value=name||profileName;

  document.getElementById('formTitle').innerText=
    isExisting?'เพิ่มเบอร์โทรสมาชิก':'สมัครสมาชิก NICHA';

  document.getElementById('formMessage').innerText=
    isExisting
    ?'กรุณากรอกเบอร์โทรศัพท์เพื่อให้ร้านค้นหาสมาชิกและดูแลแต้มของคุณได้'
    :'ยินดีต้อนรับค่ะ กรุณากรอกชื่อและเบอร์โทรเพื่อสมัครสมาชิก';

  document.getElementById('registerBtn').innerText=
    isExisting?'บันทึกเบอร์โทร':'ยืนยันสมัครสมาชิก';
}

async function submitRegistration(){
  const name=document.getElementById('inputName').value.trim();
  const phone=document.getElementById('inputPhone').value.replace(/\D/g,'');
  const btn=document.getElementById('registerBtn');
  const error=document.getElementById('formError');

  error.innerText='';

  if(!name){
    error.innerText='กรุณากรอกชื่อสมาชิก';
    return;
  }

  if(!/^0[0-9]{9}$/.test(phone)){
    error.innerText='กรุณากรอกเบอร์โทรศัพท์ 10 หลัก';
    return;
  }

  try{
    btn.disabled=true;
    btn.innerText='กำลังบันทึกข้อมูล...';

    const result=await api('register',{
      lineUserId,
      name,
      phone
    });

    if(!result.success){
      throw new Error(result.message||'บันทึกข้อมูลไม่สำเร็จ');
    }

    await enterMember(result.member);

  }catch(err){
    error.innerText=err.message;
    btn.disabled=false;
    btn.innerText='ลองอีกครั้ง';
  }
}

async function enterMember(member){
  showMember(member);

  document.getElementById('registerArea').classList.add('hidden');
  document.getElementById('memberArea').classList.remove('hidden');

  hideStatus();

  await loadRewards();
  await loadHistory();
}

function showMember(m){
  document.getElementById('memberName').innerText=m.name||'สมาชิก NICHA';
  document.getElementById('points').innerText=m.points||0;
  document.getElementById('level').innerText=m.level||'Bronze';

  document.getElementById('nextLevel').innerText=
    m.nextLevel
    ?'อีก '+m.pointsToNextLevel+' แต้ม สู่ระดับ '+m.nextLevel
    :'คุณอยู่ระดับสูงสุดแล้ว';

  document.getElementById('memberInfo').innerText=
    'ชื่อ: '+(m.name||'-')+' | เบอร์โทร: '+(m.phone||'-');

  const limits={'Bronze':100,'Silver':300,'Gold':600,'Platinum VIP':600};
  const current={'Bronze':0,'Silver':100,'Gold':300,'Platinum VIP':600};
  const max=limits[m.level]||600;
  const min=current[m.level]||0;

  const percent=m.level==='Platinum VIP'
    ?100
    :Math.min(100,Math.max(0,((m.points-min)/(max-min))*100));

  document.getElementById('progressBar').style.width=percent+'%';
}

async function loadRewards(){
  const box=document.getElementById('rewards');
  const data=await api('getRewards');

  if(!data.success) throw new Error('โหลดรางวัลไม่สำเร็จ');

  if(!data.rewards.length){
    box.innerHTML='<p class="muted">ยังไม่มีรางวัลในขณะนี้</p>';
    return;
  }

  box.innerHTML='';

  data.rewards.forEach(r=>{
    const item=document.createElement('div');
    item.className='reward';

    const info=document.createElement('div');
    const name=document.createElement('b');
    name.textContent=r.name;

    const cost=document.createElement('div');
    cost.className='muted';
    cost.textContent=r.points+' แต้ม';

    info.append(name,cost);

    const btn=document.createElement('button');
    btn.textContent='แลกรางวัล';
    btn.onclick=()=>redeem(r.rewardId);

    item.append(info,btn);
    box.appendChild(item);
  });
}

async function redeem(rewardId){
  if(!confirm('ยืนยันการแลกรางวัลนี้หรือไม่?')) return;

  try{
    const result=await api('redeem',{lineUserId,rewardId});

    if(!result.success) throw new Error(result.message);

    alert('แลกรางวัลสำเร็จ\nรหัสแลก: '+result.redemptionId);

    await refreshMember();
    await loadHistory();

  }catch(e){
    alert(e.message);
  }
}

async function refreshMember(){
  const data=await api('getMember',{lineUserId});
  if(data.success) showMember(data.member);
}

async function loadHistory(){
  const box=document.getElementById('history');
  const data=await api('getHistory',{lineUserId});

  if(!data.success) throw new Error('โหลดประวัติไม่สำเร็จ');

  const all=[];

  (data.transactions||[]).forEach(t=>{
    all.push({
      date:t.date,
      name:t.description,
      detail:(t.earned?'+'+t.earned:'')+
        (t.deducted?' -'+t.deducted:'')+' แต้ม'
    });
  });

  (data.redemptions||[]).forEach(r=>{
    all.push({
      date:r.date,
      name:'แลกรางวัล: '+r.rewardName,
      detail:r.points+' แต้ม · '+r.status
    });
  });

  all.sort((a,b)=>new Date(b.date)-new Date(a.date));

  if(!all.length){
    box.innerHTML='<p class="muted">ยังไม่มีประวัติ</p>';
    return;
  }

  box.innerHTML='';

  all.forEach(x=>{
    const div=document.createElement('div');
    div.className='history';

    const title=document.createElement('b');
    title.textContent=x.name;

    const detail=document.createElement('div');
    detail.className='muted';
    detail.textContent=x.detail+' · '+
      (x.date?new Date(x.date).toLocaleDateString('th-TH'):'-');

    div.append(title,detail);
    box.appendChild(div);
  });
}

start();
</script>
</body>
</html>
