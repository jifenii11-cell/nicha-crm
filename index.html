
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NICHA CRM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #fff8f5;
      color: #70552d;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 20px #00000010;
    }
    h1 { color: #c47b9b; }
    #status {
      margin-top: 25px;
      padding: 14px;
      background: #fff0f5;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NICHA CRM</h1>
    <p>ณิชานวดเพื่อสุขภาพ</p>
    <h3>ระบบสมาชิกสะสมแต้ม</h3>
    <p id="status">เว็บไซต์พร้อมใช้งาน</p>
  </div>
</body>
</html>
