
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123d32">
<title>NICHA CRM | ประวัติการใช้คูปอง</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
  --green:#123d32;
  --green2:#1d5948;
  --gold:#c8a45d;
  --gold2:#ead5a0;
  --bg:#f5f7f3;
  --text:#263b32;
  --muted:#829087;
  --white:#fff;
  --border:#e8ece7;
}

body{
  margin:0;
  font-family:'Kanit',sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:linear-gradient(135deg,#0e3028,#1d5948);
  color:white;
  padding:28px 20px 36px;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 25px rgba(18,61,50,.15);
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.brand{
  color:var(--gold2);
  font-family:'Playfair Display',serif;
  font-size:14px;
  letter-spacing:3px;
}

.header h1{
  font-size:25px;
  font-weight:500;
  margin:8px 0 4px;
}

.header p{
  margin:0;
  color:#d4e1d9;
  font-size:13px;
  font-weight:300;
}

.container{
  max-width:1100px;
  margin:-18px auto 40px;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 30px rgba(20,55,40,.06);
  border:1px solid rgba(200,164,93,.15);
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.toolbar h2{
  font-size:18px;
  font-weight:500;
  margin:0;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:10px 16px;
  font-family:'Kanit',sans-serif;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-back{
  background:#edf2ee;
  color:var(--green);
}

.btn-refresh{
  background:var(--green);
  color:white;
}

button:hover:not(:disabled){
  transform:translateY(-1px);
  opacity:.9;
}

.summary{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px;
}

.summary-box{
  background:linear-gradient(135deg,#f8f5eb,#fffdf8);
  border:1px solid #eee4ca;
  padding:16px;
  border-radius:16px;
}

.summary-label{
  color:#8d8064;
  font-size:12px;
}

.summary-value{
  color:var(--green);
  font-size:25px;
  font-weight:600;
  margin-top:3px;
}

.search-wrap{
  margin-bottom:16px;
}

.search-wrap input{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 15px;
  font-family:'Kanit',sans-serif;
  font-size:14px;
  outline:none;
  background:#fcfdfb;
}

.search-wrap input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(200,164,93,.12);
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:14px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th{
  background:#f4f7f3;
  color:var(--green);
  font-size:12px;
  font-weight:500;
  padding:14px 12px;
  text-align:left;
  white-space:nowrap;
}

td{
  padding:14px 12px;
  border-top:1px solid #edf0ec;
  font-size:13px;
  vertical-align:middle;
}

tbody tr:hover{
  background:#fcfdfb;
}

.sub{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
  word-break:break-all;
}

.status{
  display:inline-block;
  border-radius:30px;
  padding:5px 11px;
  font-size:11px;
  white-space:nowrap;
}

.status-pending{
  background:#fff4d9;
  color:#9a6a13;
}

.status-used{
  background:#e4f3e9;
  color:#237345;
}

.status-other{
  background:#eef0f2;
  color:#59636b;
}

.loading,.empty,.error{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.error{
  color:#b63c3c;
}

.footer{
  text-align:center;
  color:#9aa49d;
  font-size:11px;
  padding:20px;
}

@media(max-width:600px){
  .header{padding:24px 18px 34px}
  .header h1{font-size:22px}
  .card{padding:16px}
  .toolbar{align-items:flex-start}
  .toolbar h2{width:100%}
  .actions{width:100%}
  .actions button{flex:1}
  .summary-value{font-size:22px}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">NICHA CRM</div>
    <h1>ประวัติการใช้คูปอง</h1>
    <p>Coupon Usage History · ระบบจัดการสมาชิก ณิชานวดเพื่อสุขภาพ</p>
  </div>
</header>

<main class="container">
  <section class="card">

    <div class="toolbar">
      <h2>รายการประวัติทั้งหมด</h2>

      <div class="actions">
        <button class="btn-back" onclick="goBack()">
          ← กลับหน้าจัดการคูปอง
        </button>

        <button class="btn-refresh" id="refreshBtn" onclick="loadHistory()">
          ↻ รีเฟรชรายการ
        </button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-box">
        <div class="summary-label">ประวัติทั้งหมด</div>
        <div class="summary-value" id="totalCount">0</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">ยืนยันใช้คูปองแล้ว</div>
        <div class="summary-value" id="usedCount">0</div>
      </div>
    </div>

    <div class="search-wrap">
      <input
        type="search"
        id="searchInput"
        placeholder="ค้นหาชื่อสมาชิก ชื่อคูปอง หรือรหัสคูปอง..."
        oninput="renderHistory()"
      >
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>วันที่และเวลา</th>
            <th>สมาชิก</th>
            <th>ชื่อคูปอง</th>
            <th>รายการ</th>
            <th>สถานะเดิม</th>
            <th>สถานะใหม่</th>
            <th>ผู้ดำเนินการ</th>
          </tr>
        </thead>

        <tbody id="historyBody">
          <tr>
            <td colspan="7" class="loading">
              กำลังโหลดประวัติ...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </section>
</main>

<div class="footer">
  NICHA CRM · Premium Member Management
</div>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbyTicniXNgmKtRavQPXdaJa8FWU05-_alup6V4A6Ikm5B1rxMDs8Bv4cj5G6ywPt0Pu0Q/exec';

let historyData = [];

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function formatDate(value){
  if(!value) return '-';

  const date = new Date(value);

  if(isNaN(date.getTime())) {
    return escapeHTML(value);
  }

  return date.toLocaleString('th-TH',{
    day:'2-digit',
    month:'short',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  });
}

function getStatusClass(status){
  const value = String(status || '').trim();

  if(value === 'รอยืนยัน') return 'status-pending';
  if(value === 'ใช้แล้ว') return 'status-used';

  return 'status-other';
}

function statusHTML(status){
  const value = status || '-';

  return `<span class="status ${getStatusClass(value)}">
    ${escapeHTML(value)}
  </span>`;
}

async function loadHistory(){
  const body = document.getElementById('historyBody');
  const button = document.getElementById('refreshBtn');

  body.innerHTML = `
    <tr>
      <td colspan="7" class="loading">กำลังโหลดประวัติ...</td>
    </tr>`;

  button.disabled = true;
  button.textContent = 'กำลังโหลด...';

  try{
    const response = await fetch(API_URL,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain;charset=utf-8'
      },
      body:JSON.stringify({
        action:'getCouponHistory'
      })
    });

    if(!response.ok){
      throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
    }

    const data = await response.json();

    if(!data.success){
      throw new Error(data.message || 'ไม่สามารถโหลดประวัติได้');
    }

    historyData = Array.isArray(data.history)
      ? data.history
      : [];

    document.getElementById('totalCount').textContent =
      historyData.length.toLocaleString('th-TH');

    document.getElementById('usedCount').textContent =
      historyData.filter(item =>
        String(item.newStatus || '').trim() === 'ใช้แล้ว'
      ).length.toLocaleString('th-TH');

    renderHistory();

  }catch(error){
    body.innerHTML = `
      <tr>
        <td colspan="7" class="error">
          ${escapeHTML(error.message || 'เกิดข้อผิดพลาด')}
          <br><br>
          กรุณากดปุ่มรีเฟรชเพื่อลองอีกครั้ง
        </td>
      </tr>`;
  }finally{
    button.disabled = false;
    button.textContent = '↻ รีเฟรชรายการ';
  }
}

function renderHistory(){
  const body = document.getElementById('historyBody');
  const keyword = document.getElementById('searchInput')
    .value.trim().toLowerCase();

  const filtered = historyData.filter(item => {
    const text = [
      item.couponId,
      item.lineUserId,
      item.memberName,
      item.couponName,
      item.action,
      item.oldStatus,
      item.newStatus,
      item.actor
    ].join(' ').toLowerCase();

    return text.includes(keyword);
  });

  if(filtered.length === 0){
    body.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          ไม่พบประวัติการใช้คูปอง
        </td>
      </tr>`;
    return;
  }

  body.innerHTML = filtered.map(item => `
    <tr>
      <td>${formatDate(item.date)}</td>

      <td>
        ${escapeHTML(item.memberName || '-')}
        <span class="sub">${escapeHTML(item.lineUserId || '')}</span>
      </td>

      <td>
        ${escapeHTML(item.couponName || '-')}
        <span class="sub">${escapeHTML(item.couponId || '')}</span>
      </td>

      <td>${escapeHTML(item.action || '-')}</td>

      <td>${statusHTML(item.oldStatus)}</td>

      <td>${statusHTML(item.newStatus)}</td>

      <td>${escapeHTML(item.actor || '-')}</td>
    </tr>
  `).join('');
}

function goBack(){
  window.location.href = 'coupons-admin.html';
}

loadHistory();
</script>

</body>
</html>
