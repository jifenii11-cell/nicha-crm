
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>NICHA CRM | จัดการสิทธิพิเศษ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');

:root{
  --green:#123d32;
  --green2:#1d5948;
  --gold:#c6a45c;
  --bg:#f4f6f3;
  --white:#fff;
  --text:#26352f;
  --muted:#7b8982;
  --red:#bd4545;
  --border:#e4eae5;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Kanit',sans-serif;
}

button,input,textarea,select{
  font-family:inherit;
}

.header{
  background:linear-gradient(135deg,var(--green),#245b48);
  color:white;
  padding:25px 18px 30px;
  border-radius:0 0 25px 25px;
}

.header-inner{
  max-width:850px;
  margin:auto;
}

.brand{
  color:#e3c77e;
  font-size:12px;
  letter-spacing:2px;
}

.header h1{
  margin:5px 0;
  font-size:23px;
  font-weight:600;
}

.header p{
  margin:0;
  color:#d4e1d9;
  font-size:13px;
}

.container{
  max-width:850px;
  margin:20px auto;
  padding:0 15px 40px;
}

.panel{
  background:white;
  border-radius:17px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px #183d3210;
}

.panel-title{
  font-size:17px;
  font-weight:600;
  margin-bottom:14px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:500;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:14px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--gold);
}

textarea{
  min-height:75px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.levels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.level-option{
  display:flex;
  align-items:center;
  gap:8px;
  background:#f7f9f7;
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px;
  font-size:13px;
}

.level-option input{
  width:auto;
  accent-color:var(--green);
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
}

.btn-primary{
  background:var(--green);
  color:white;
}

.btn-gold{
  background:var(--gold);
  color:#fff;
}

.btn-light{
  background:#edf2ee;
  color:var(--green);
}

.btn-danger{
  background:#fff0f0;
  color:var(--red);
}

.btn-block{
  width:100%;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar .btn{
  flex:1;
}

.privilege-card{
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  margin-bottom:12px;
  background:white;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.privilege-name{
  font-size:16px;
  font-weight:600;
  color:var(--green);
}

.privilege-desc{
  color:#68766e;
  font-size:13px;
  margin:8px 0;
  white-space:pre-wrap;
}

.meta{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
}

.status{
  display:inline-block;
  padding:4px 9px;
  border-radius:20px;
  font-size:11px;
  white-space:nowrap;
}

.status-active{
  background:#e7f5eb;
  color:#267044;
}

.status-inactive{
  background:#fceaea;
  color:#b33e3e;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.card-actions button{
  flex:1;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
  font-size:14px;
}

.hidden{display:none!important}

.message{
  padding:11px 13px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:13px;
}

.message.error{
  background:#fff0f0;
  color:#a33;
}

.message.success{
  background:#e9f6ed;
  color:#267044;
}

.pin-note{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

.form-actions{
  display:flex;
  gap:9px;
}

.form-actions button{
  flex:1;
}

.loading{
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:520px){
  .row{grid-template-columns:1fr}
  .header h1{font-size:21px}
  .panel{padding:15px}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">NICHA HEALTH MASSAGE</div>
    <h1>✨ จัดการสิทธิพิเศษสมาชิก</h1>
    <p>ระบบบริหารสิทธิประโยชน์ตามระดับสมาชิก</p>
  </div>
</header>

<main class="container">

  <!-- PIN -->
  <section class="panel" id="loginPanel">
    <div class="panel-title">🔐 เข้าสู่ระบบพนักงาน</div>

    <div class="field">
      <label>รหัส PIN พนักงาน</label>
      <input
        type="password"
        id="staffPin"
        placeholder="กรอกรหัส PIN"
        inputmode="numeric"
      >
    </div>

    <button class="btn btn-primary btn-block" id="loginBtn" onclick="login()">
      เข้าสู่ระบบ
    </button>

    <div class="pin-note">
      กรุณากรอกรหัส PIN พนักงานเพื่อจัดการสิทธิพิเศษ
    </div>
  </section>

  <!-- MAIN -->
  <section id="mainPanel" class="hidden">

    <div class="panel">
      <div class="panel-title">📋 รายการสิทธิพิเศษ</div>

      <div class="toolbar">
        <button class="btn btn-gold" onclick="newPrivilege()">
          + เพิ่มสิทธิพิเศษ
        </button>
        <button class="btn btn-light" onclick="loadPrivileges()">
          ↻ รีเฟรช
        </button>
      </div>

      <div id="listMessage"></div>
      <div id="privilegeList" class="loading">
        กำลังโหลดข้อมูล...
      </div>
    </div>

    <!-- FORM -->
    <div class="panel hidden" id="formPanel">
      <div class="panel-title" id="formTitle">
        เพิ่มสิทธิพิเศษใหม่
      </div>

      <div id="formMessage"></div>

      <input type="hidden" id="privilegeId">

      <div class="field">
        <label>ชื่อสิทธิพิเศษ *</label>
        <input id="privilegeName" placeholder="เช่น ส่วนลดนวด 10%">
      </div>

      <div class="field">
        <label>รายละเอียด</label>
        <textarea id="privilegeDescription"
          placeholder="รายละเอียดสิทธิพิเศษ"></textarea>
      </div>

      <div class="field">
        <label>ระดับสมาชิกที่ได้รับสิทธิ์ *</label>
        <div class="levels">
          <label class="level-option">
            <input type="checkbox" name="level" value="ทุกระดับ">
            ทุกระดับ
          </label>
          <label class="level-option">
            <input type="checkbox" name="level" value="Bronze">
            BRONZE
          </label>
          <label class="level-option">
            <input type="checkbox" name="level" value="Silver">
            SILVER
          </label>
          <label class="level-option">
            <input type="checkbox" name="level" value="Gold">
            GOLD
          </label>
          <label class="level-option">
            <input type="checkbox" name="level" value="Platinum VIP">
            PLATINUM VIP
          </label>
        </div>
      </div>

      <div class="field">
        <label>ประเภทสิทธิ์</label>
        <select id="privilegeType">
          <option value="ส่วนลด">ส่วนลด</option>
          <option value="บริการฟรี">บริการฟรี</option>
          <option value="ของขวัญ">ของขวัญ</option>
          <option value="อัปเกรดบริการ">อัปเกรดบริการ</option>
          <option value="ทั่วไป">ทั่วไป</option>
        </select>
      </div>

      <div class="field">
        <label>มูลค่า / เงื่อนไข</label>
        <input id="privilegeValue"
          placeholder="เช่น ลด 10% หรือ นวดฟรี 30 นาที">
      </div>

      <div class="row">
        <div class="field">
          <label>วันเริ่มต้น</label>
          <input type="date" id="startDate">
        </div>

        <div class="field">
          <label>วันสิ้นสุด</label>
          <input type="date" id="endDate">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>สถานะ</label>
          <select id="privilegeStatus">
            <option value="ใช้งาน">ใช้งาน</option>
            <option value="ปิดใช้งาน">ปิดใช้งาน</option>
          </select>
        </div>

        <div class="field">
          <label>ลำดับการแสดงผล</label>
          <input type="number" id="privilegeSort" value="1" min="0">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="saveBtn" onclick="savePrivilege()">
          บันทึกข้อมูล
        </button>
        <button class="btn btn-light" onclick="closeForm()">
          ยกเลิก
        </button>
      </div>
    </div>

    <button class="btn btn-light btn-block" onclick="logout()">
      ออกจากระบบพนักงาน
    </button>

  </section>
</main>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbyTicniXNgmKtRavQPXdaJa8FWU05-_alup6V4A6Ikm5B1rxMDs8Bv4cj5G6ywPt0Pu0Q/exec';

let staffPin = '';
let privileges = [];

function jsonp(action, params = {}) {
  return new Promise((resolve, reject) => {
    const callbackName =
      'nichaCallback_' + Date.now() + '_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');
    const query = new URLSearchParams({
      action,
      ...params,
      callback: callbackName
    });

    let finished = false;

    const timer = setTimeout(() => {
      finish();
      reject(new Error('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'));
    }, 20000);

    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = data => {
      finish();
      resolve(data);
    };

    script.onerror = () => {
      finish();
      reject(new Error('ไม่สามารถเชื่อมต่อ Google Apps Script ได้'));
    };

    script.src = API_URL + '?' + query.toString();
    document.body.appendChild(script);
  });
}

function showMessage(id, message, type = 'error') {
  const el = document.getElementById(id);
  el.innerHTML = message
    ? `<div class="message ${type}">${escapeHTML(message)}</div>`
    : '';
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

async function login() {
  const pin = document.getElementById('staffPin').value.trim();

  if (!pin) {
    alert('กรุณากรอกรหัส PIN พนักงาน');
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';

  try {
    const result = await jsonp('getAllPrivileges', {pin});

    if (!result || result.success !== true) {
      throw new Error(result?.message || 'ไม่สามารถเข้าสู่ระบบได้');
    }

    staffPin = pin;
    document.getElementById('loginPanel').classList.add('hidden');
    document.getElementById('mainPanel').classList.remove('hidden');

    renderPrivileges(result.privileges || result.data || []);

  } catch (error) {
    alert(error.message || 'เกิดข้อผิดพลาด');
  } finally {
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

async function loadPrivileges() {
  const list = document.getElementById('privilegeList');
  list.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';

  try {
    const result = await jsonp('getAllPrivileges', {pin: staffPin});

    if (!result || result.success !== true) {
      throw new Error(result?.message || 'โหลดข้อมูลไม่สำเร็จ');
    }

    renderPrivileges(result.privileges || result.data || []);

  } catch (error) {
    list.innerHTML = '';
    showMessage('listMessage', error.message);
  }
}

function renderPrivileges(items) {
  privileges = Array.isArray(items) ? items : [];

  showMessage('listMessage', '');

  const list = document.getElementById('privilegeList');

  if (!privileges.length) {
    list.innerHTML =
      '<div class="empty">ยังไม่มีรายการสิทธิพิเศษ<br>กดปุ่ม “เพิ่มสิทธิพิเศษ” เพื่อเริ่มต้น</div>';
    return;
  }

  list.innerHTML = privileges.map((p, index) => {
    const id = p.privilegeId || '';
    const levels = Array.isArray(p.levels)
      ? p.levels.join(', ')
      : (p.levels || '');

    const active = p.status === 'ใช้งาน';

    return `
      <div class="privilege-card">
        <div class="card-top">
          <div class="privilege-name">
            ${escapeHTML(p.name || 'ไม่มีชื่อสิทธิพิเศษ')}
          </div>
          <span class="status ${active ? 'status-active' : 'status-inactive'}">
            ${escapeHTML(p.status || 'ไม่ระบุสถานะ')}
          </span>
        </div>

        <div class="privilege-desc">
          ${escapeHTML(p.description || 'ไม่มีรายละเอียด')}
        </div>

        <div class="meta">
          <div>🎖 ระดับสมาชิก: ${escapeHTML(levels || '-')}</div>
          <div>ประเภท: ${escapeHTML(p.type || '-')}</div>
          <div>มูลค่า / เงื่อนไข: ${escapeHTML(p.value || '-')}</div>
          <div>วันเริ่มต้น: ${escapeHTML(p.startDate || '-')}</div>
          <div>วันสิ้นสุด: ${escapeHTML(p.endDate || '-')}</div>
          <div>ลำดับ: ${escapeHTML(p.sort ?? '-')}</div>
        </div>

        <div class="card-actions">
          <button class="btn btn-light"
            onclick="editPrivilege(${index})">✏️ แก้ไข</button>
          <button class="btn btn-danger"
            onclick="removePrivilege('${escapeHTML(id)}')">ลบ</button>
        </div>
      </div>
    `;
  }).join('');
}

function newPrivilege() {
  clearForm();
  document.getElementById('formTitle').textContent =
    'เพิ่มสิทธิพิเศษใหม่';
  document.getElementById('formPanel').classList.remove('hidden');
  document.getElementById('formPanel').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
}

function clearForm() {
  document.getElementById('privilegeId').value = '';
  document.getElementById('privilegeName').value = '';
  document.getElementById('privilegeDescription').value = '';
  document.getElementById('privilegeType').value = 'ส่วนลด';
  document.getElementById('privilegeValue').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  document.getElementById('privilegeStatus').value = 'ใช้งาน';
  document.getElementById('privilegeSort').value = '1';

  document.querySelectorAll('input[name="level"]')
    .forEach(el => el.checked = false);

  showMessage('formMessage', '');
}

function editPrivilege(index) {
  const p = privileges[index];
  if (!p) return;

  clearForm();

  document.getElementById('formTitle').textContent =
    'แก้ไขสิทธิพิเศษ';

  document.getElementById('privilegeId').value =
    p.privilegeId || '';

  document.getElementById('privilegeName').value =
    p.name || '';

  document.getElementById('privilegeDescription').value =
    p.description || '';

  document.getElementById('privilegeType').value =
    p.type || 'ทั่วไป';

  document.getElementById('privilegeValue').value =
    p.value || '';

  document.getElementById('startDate').value =
    normalizeDate(p.startDate);

  document.getElementById('endDate').value =
    normalizeDate(p.endDate);

  document.getElementById('privilegeStatus').value =
    p.status || 'ใช้งาน';

  document.getElementById('privilegeSort').value =
    p.sort ?? 1;

  let levels = Array.isArray(p.levels)
    ? p.levels
    : String(p.levels || '').split(',').map(x => x.trim());

  document.querySelectorAll('input[name="level"]')
    .forEach(el => {
      el.checked = levels.includes(el.value);
    });

  document.getElementById('formPanel').classList.remove('hidden');
  document.getElementById('formPanel').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
}

function normalizeDate(value) {
  if (!value) return '';

  const text = String(value);

  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    return text;
  }

  const date = new Date(text);

  if (isNaN(date.getTime())) return '';

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('-');
}

function closeForm() {
  document.getElementById('formPanel').classList.add('hidden');
}

async function savePrivilege() {
  const id = document.getElementById('privilegeId').value.trim();
  const name = document.getElementById('privilegeName').value.trim();

  const levels = Array.from(
    document.querySelectorAll('input[name="level"]:checked')
  ).map(el => el.value);

  if (!name) {
    alert('กรุณากรอกชื่อสิทธิพิเศษ');
    return;
  }

  if (!levels.length) {
    alert('กรุณาเลือกระดับสมาชิกอย่างน้อย 1 ระดับ');
    return;
  }

  if (levels.includes('ทุกระดับ') && levels.length > 1) {
    alert('หากเลือกทุกระดับ ไม่ต้องเลือกระดับอื่นเพิ่มเติม');
    return;
  }

  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;

  if (startDate && endDate && endDate < startDate) {
    alert('วันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น');
    return;
  }

  const params = {
    pin: staffPin,
    privilegeId: id,
    name,
    description: document.getElementById('privilegeDescription').value.trim(),
    levels: levels.join(','),
    type: document.getElementById('privilegeType').value,
    value: document.getElementById('privilegeValue').value.trim(),
    startDate,
    endDate,
    status: document.getElementById('privilegeStatus').value,
    sort: document.getElementById('privilegeSort').value || '1'
  };

  const editing = Boolean(id);
  const action = editing ? 'editPrivilege' : 'addPrivilege';

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try {
    const result = await jsonp(action, params);

    if (!result || result.success !== true) {
      throw new Error(result?.message || 'บันทึกข้อมูลไม่สำเร็จ');
    }

    showMessage(
      'formMessage',
      result.message || 'บันทึกข้อมูลเรียบร้อยแล้ว',
      'success'
    );

    await loadPrivileges();
    closeForm();

    alert(editing
      ? 'แก้ไขสิทธิพิเศษเรียบร้อยแล้ว'
      : 'เพิ่มสิทธิพิเศษเรียบร้อยแล้ว');

  } catch (error) {
    showMessage('formMessage', error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'บันทึกข้อมูล';
  }
}

async function removePrivilege(id) {
  if (!id) {
    alert('ไม่พบรหัสสิทธิพิเศษ');
    return;
  }

  const confirmed = confirm(
    'ต้องการลบสิทธิพิเศษรายการนี้ใช่หรือไม่?'
  );

  if (!confirmed) return;

  try {
    const result = await jsonp('deletePrivilege', {
      pin: staffPin,
      privilegeId: id
    });

    if (!result || result.success !== true) {
      throw new Error(result?.message || 'ลบข้อมูลไม่สำเร็จ');
    }

    alert(result.message || 'ลบสิทธิพิเศษเรียบร้อยแล้ว');
    await loadPrivileges();

  } catch (error) {
    alert(error.message || 'เกิดข้อผิดพลาด');
  }
}

function logout() {
  staffPin = '';
  privileges = [];

  document.getElementById('staffPin').value = '';
  document.getElementById('mainPanel').classList.add('hidden');
  document.getElementById('loginPanel').classList.remove('hidden');
  closeForm();
}

document.getElementById('staffPin')
  .addEventListener('keydown', event => {
    if (event.key === 'Enter') login();
  });
</script>
