
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>NICHA CRM | จัดการสิทธิพิเศษ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');

:root {
  --green:#123d32;
  --green2:#1c5748;
  --gold:#c6a15b;
  --bg:#f4f6f2;
  --white:#fff;
  --text:#26352f;
  --muted:#78847e;
  --border:#e2e8e2;
  --red:#c0392b;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Kanit',sans-serif;
}

button,input,textarea,select {
  font-family:inherit;
  font-size:14px;
}

.header {
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:white;
  padding:24px 18px;
}

.header-inner {
  max-width:900px;
  margin:auto;
}

.brand {
  color:#e7d2a5;
  font-size:12px;
  letter-spacing:2px;
}

.header h1 {
  margin:5px 0;
  font-size:23px;
  font-weight:600;
}

.header p {
  margin:0;
  color:#d4e1d9;
  font-size:13px;
}

.container {
  max-width:900px;
  margin:20px auto;
  padding:0 14px 40px;
}

.top-actions {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.btn {
  border:0;
  border-radius:10px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:500;
}

.btn-primary {
  background:var(--green);
  color:white;
}

.btn-gold {
  background:var(--gold);
  color:#fff;
}

.btn-light {
  background:white;
  color:var(--green);
  border:1px solid var(--border);
}

.btn-danger {
  background:#fff0ee;
  color:var(--red);
}

.btn:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.panel {
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.035);
}

.panel-title {
  font-size:17px;
  font-weight:600;
  color:var(--green);
  margin:0 0 15px;
}

.form-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.field {
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full {
  grid-column:1/-1;
}

label {
  font-size:13px;
  font-weight:500;
}

input,textarea,select {
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px;
  outline:none;
  background:white;
  color:var(--text);
}

input:focus,textarea:focus,select:focus {
  border-color:var(--green2);
}

textarea {
  min-height:75px;
  resize:vertical;
}

.levels {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.level-option {
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  border-radius:9px;
  padding:8px 10px;
  font-size:13px;
  cursor:pointer;
}

.level-option input {
  width:auto;
  accent-color:var(--green);
}

.form-buttons {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:17px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat {
  background:white;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
}

.stat small {
  color:var(--muted);
  font-size:12px;
}

.stat strong {
  display:block;
  color:var(--green);
  font-size:23px;
}

.search {
  margin-bottom:14px;
}

.privilege-card {
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  margin-bottom:11px;
  background:#fff;
}

.card-top {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.card-name {
  font-size:16px;
  font-weight:600;
  color:var(--green);
}

.card-description {
  font-size:13px;
  color:#65736b;
  margin:7px 0;
  white-space:pre-wrap;
}

.meta {
  font-size:12px;
  color:var(--muted);
  line-height:1.9;
}

.pill {
  display:inline-block;
  border-radius:30px;
  padding:3px 10px;
  font-size:11px;
  background:#e7f3eb;
  color:#287047;
}

.pill.off {
  background:#fcebea;
  color:#b33c32;
}

.card-actions {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.card-actions button {
  padding:7px 12px;
  font-size:12px;
}

.empty {
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
}

.message {
  display:none;
  padding:11px 13px;
  border-radius:10px;
  margin-bottom:14px;
  font-size:13px;
}

.message.success {
  display:block;
  background:#e8f5eb;
  color:#246b3c;
}

.message.error {
  display:block;
  background:#fff0ee;
  color:#a93226;
}

.loading {
  text-align:center;
  padding:20px;
  color:var(--muted);
}

@media(max-width:600px) {
  .form-grid { grid-template-columns:1fr; }
  .field.full { grid-column:auto; }
  .stats { gap:7px; }
  .stat { padding:10px; }
  .stat strong { font-size:20px; }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">NICHA CRM</div>
    <h1>จัดการสิทธิพิเศษสมาชิก</h1>
    <p>MEMBER PRIVILEGES MANAGEMENT</p>
  </div>
</header>

<main class="container">

  <div id="message" class="message"></div>

  <div class="top-actions">
    <button class="btn btn-light" onclick="loadPrivileges()">
      ↻ รีเฟรชข้อมูล
    </button>
    <button class="btn btn-light" onclick="changePin()">
      🔐 เปลี่ยน PIN
    </button>
  </div>

  <section class="stats">
    <div class="stat">
      <small>สิทธิพิเศษทั้งหมด</small>
      <strong id="totalCount">0</strong>
    </div>
    <div class="stat">
      <small>กำลังใช้งาน</small>
      <strong id="activeCount">0</strong>
    </div>
    <div class="stat">
      <small>ปิดใช้งาน</small>
      <strong id="inactiveCount">0</strong>
    </div>
  </section>

  <section class="panel" id="formPanel">
    <h2 class="panel-title" id="formTitle">
      ✨ เพิ่มสิทธิพิเศษใหม่
    </h2>

    <input type="hidden" id="privilegeId">

    <div class="form-grid">

      <div class="field full">
        <label>ชื่อสิทธิพิเศษ *</label>
        <input id="name" placeholder="เช่น ส่วนลดนวดน้ำมัน 10%">
      </div>

      <div class="field full">
        <label>รายละเอียด</label>
        <textarea id="description"
          placeholder="อธิบายรายละเอียดสิทธิพิเศษ"></textarea>
      </div>

      <div class="field full">
        <label>ระดับสมาชิกที่ได้รับสิทธิ์ *</label>
        <div class="levels">
          <label class="level-option">
            <input type="checkbox" name="levels" value="ทุกระดับ">
            ทุกระดับ
          </label>
          <label class="level-option">
            <input type="checkbox" name="levels" value="Bronze">
            Bronze
          </label>
          <label class="level-option">
            <input type="checkbox" name="levels" value="Silver">
            Silver
          </label>
          <label class="level-option">
            <input type="checkbox" name="levels" value="Gold">
            Gold
          </label>
          <label class="level-option">
            <input type="checkbox" name="levels" value="Platinum VIP">
            Platinum VIP
          </label>
        </div>
      </div>

      <div class="field">
        <label>ประเภทสิทธิ์</label>
        <select id="type">
          <option value="ส่วนลด">ส่วนลด</option>
          <option value="บริการฟรี">บริการฟรี</option>
          <option value="ของขวัญ">ของขวัญ</option>
          <option value="อัปเกรดบริการ">อัปเกรดบริการ</option>
          <option value="ทั่วไป">ทั่วไป</option>
        </select>
      </div>

      <div class="field">
        <label>มูลค่า / เงื่อนไข</label>
        <input id="value" placeholder="เช่น ลด 100 บาท">
      </div>

      <div class="field">
        <label>วันเริ่มต้น (ไม่บังคับ)</label>
        <input id="startDate" type="date">
      </div>

      <div class="field">
        <label>วันสิ้นสุด (ไม่บังคับ)</label>
        <input id="endDate" type="date">
      </div>

      <div class="field">
        <label>สถานะ</label>
        <select id="status">
          <option value="ใช้งาน">เปิดใช้งาน</option>
          <option value="ปิดใช้งาน">ปิดใช้งาน</option>
        </select>
      </div>

      <div class="field">
        <label>ลำดับการแสดงผล</label>
        <input id="sort" type="number" value="0">
      </div>

    </div>

    <div class="form-buttons">
      <button class="btn btn-primary" id="saveButton"
        onclick="savePrivilege()">
        บันทึกสิทธิพิเศษ
      </button>

      <button class="btn btn-light" onclick="resetForm()">
        ล้างข้อมูล
      </button>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title">📋 รายการสิทธิพิเศษ</h2>

    <input class="search" id="searchInput"
      placeholder="ค้นหาชื่อสิทธิพิเศษ..."
      oninput="renderPrivileges()">

    <div id="privilegeList">
      <div class="loading">กำลังโหลดข้อมูล...</div>
    </div>
  </section>

</main>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbyTicniXNgmKtRavQPXdaJa8FWU05-_alup6V4A6Ikm5B1rxMDs8Bv4cj5G6ywPt0Pu0Q/exec';

let STAFF_PIN_VALUE = '';
let privileges = [];
let requestNumber = 0;

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function showMessage(message, type) {
  const el = document.getElementById('message');
  el.className = 'message ' + type;
  el.textContent = message;

  window.scrollTo({top:0,behavior:'smooth'});
}

function api(action, params = {}) {
  return new Promise((resolve,reject) => {
    const callback = 'nichaCallback' + (++requestNumber);
    const script = document.createElement('script');
    const query = new URLSearchParams({
      action,
      ...params,
      callback
    });

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('หมดเวลาการเชื่อมต่อ กรุณาลองใหม่'));
    },20000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callback];
      script.remove();
    }

    window[callback] = function(result) {
      cleanup();

      if (!result || result.success !== true) {
        reject(new Error(
          result && result.message
            ? result.message
            : 'เกิดข้อผิดพลาดจากระบบ'
        ));
        return;
      }

      resolve(result);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('ไม่สามารถเชื่อมต่อ NICHA CRM API ได้'));
    };

    script.src = API_URL + '?' + query.toString();
    document.body.appendChild(script);
  });
}

function askPin() {
  if (STAFF_PIN_VALUE) return true;

  const pin = prompt('กรุณากรอก PIN พนักงาน');

  if (pin === null || !pin.trim()) return false;

  STAFF_PIN_VALUE = pin.trim();
  return true;
}

function changePin() {
  STAFF_PIN_VALUE = '';
  askPin();
}

async function loadPrivileges() {
  if (!askPin()) return;

  const list = document.getElementById('privilegeList');
  list.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';

  try {
    const result = await api('getAllPrivileges', {
      pin: STAFF_PIN_VALUE
    });

    privileges = result.privileges || [];
    renderPrivileges();

  } catch (error) {
    list.innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>';

    if (error.message.includes('PIN')) {
      STAFF_PIN_VALUE = '';
    }

    showMessage(error.message,'error');
  }
}

function updateStats() {
  document.getElementById('totalCount').textContent =
    privileges.length;

  document.getElementById('activeCount').textContent =
    privileges.filter(x => x.status === 'ใช้งาน').length;

  document.getElementById('inactiveCount').textContent =
    privileges.filter(x => x.status !== 'ใช้งาน').length;
}

function formatDate(value) {
  if (!value) return 'ไม่กำหนด';

  const d = new Date(value);

  if (isNaN(d.getTime())) return String(value);

  return d.toLocaleDateString('th-TH',{
    day:'numeric',
    month:'short',
    year:'numeric',
    timeZone:'Asia/Bangkok'
  });
}

function renderPrivileges() {
  updateStats();

  const keyword = document.getElementById('searchInput')
    .value.trim().toLowerCase();

  const filtered = privileges.filter(item =>
    String(item.name || '').toLowerCase().includes(keyword) ||
    String(item.description || '').toLowerCase().includes(keyword)
  );

  const list = document.getElementById('privilegeList');

  if (!filtered.length) {
    list.innerHTML =
      '<div class="empty">ยังไม่มีสิทธิพิเศษ หรือไม่พบรายการที่ค้นหา</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    const levels = String(item.levels || '').split(',').join(', ');

    return `
      <div class="privilege-card">
        <div class="card-top">
          <div>
            <div class="card-name">${escapeHTML(item.name)}</div>
            <div class="card-description">
              ${escapeHTML(item.description || 'ไม่มีรายละเอียด')}
            </div>
          </div>

          <span class="pill ${item.status === 'ใช้งาน' ? '' : 'off'}">
            ${escapeHTML(item.status)}
          </span>
        </div>

        <div class="meta">
          <div>รหัส: ${escapeHTML(item.privilegeId)}</div>
          <div>ระดับสมาชิก: ${escapeHTML(levels)}</div>
          <div>ประเภท: ${escapeHTML(item.type)}</div>
          <div>มูลค่า/เงื่อนไข: ${escapeHTML(item.value || '-')}</div>
          <div>เริ่ม: ${escapeHTML(formatDate(item.startDate))}</div>
          <div>สิ้นสุด: ${escapeHTML(formatDate(item.endDate))}</div>
          <div>ลำดับ: ${escapeHTML(item.sort)}</div>
        </div>

        <div class="card-actions">
          <button class="btn btn-gold"
            onclick="editPrivilege('${escapeHTML(item.privilegeId)}')">
            แก้ไข
          </button>

          <button class="btn btn-light"
            onclick="togglePrivilege('${escapeHTML(item.privilegeId)}')">
            ${item.status === 'ใช้งาน' ? 'ปิดใช้งาน' : 'เปิดใช้งาน'}
          </button>

          <button class="btn btn-danger"
            onclick="removePrivilege('${escapeHTML(item.privilegeId)}')">
            ลบ
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function getSelectedLevels() {
  return Array.from(
    document.querySelectorAll('input[name="levels"]:checked')
  ).map(el => el.value);
}

function setSelectedLevels(levels) {
  const selected = String(levels || '').split(',').map(x => x.trim());

  document.querySelectorAll('input[name="levels"]').forEach(el => {
    el.checked = selected.includes(el.value);
  });
}

function resetForm() {
  document.getElementById('privilegeId').value = '';
  document.getElementById('name').value = '';
  document.getElementById('description').value = '';
  document.getElementById('type').value = 'ส่วนลด';
  document.getElementById('value').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  document.getElementById('status').value = 'ใช้งาน';
  document.getElementById('sort').value = '0';

  document.querySelectorAll('input[name="levels"]')
    .forEach(el => el.checked = false);

  document.getElementById('formTitle').textContent =
    '✨ เพิ่มสิทธิพิเศษใหม่';

  document.getElementById('saveButton').textContent =
    'บันทึกสิทธิพิเศษ';
}

function editPrivilege(id) {
  const item = privileges.find(x =>
    String(x.privilegeId) === String(id)
  );

  if (!item) return;

  document.getElementById('privilegeId').value = item.privilegeId;
  document.getElementById('name').value = item.name || '';
  document.getElementById('description').value =
    item.description || '';

  document.getElementById('type').value =
    item.type || 'ทั่วไป';

  document.getElementById('value').value = item.value || '';
  document.getElementById('startDate').value =
    toInputDate(item.startDate);

  document.getElementById('endDate').value =
    toInputDate(item.endDate);

  document.getElementById('status').value =
    item.status || 'ใช้งาน';

  document.getElementById('sort').value = item.sort || 0;

  setSelectedLevels(item.levels);

  document.getElementById('formTitle').textContent =
    '✏️ แก้ไขสิทธิพิเศษ';

  document.getElementById('saveButton').textContent =
    'บันทึกการแก้ไข';

  document.getElementById('formPanel').scrollIntoView({
    behavior:'smooth'
  });
}

function toInputDate(value) {
  if (!value) return '';

  const d = new Date(value);

  if (isNaN(d.getTime())) return '';

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

async function savePrivilege() {
  if (!askPin()) return;

  const id = document.getElementById('privilegeId').value;
  const name = document.getElementById('name').value.trim();
  const levels = getSelectedLevels();

  if (!name) {
    showMessage('กรุณากรอกชื่อสิทธิพิเศษ','error');
    return;
  }

  if (!levels.length) {
    showMessage('กรุณาเลือกระดับสมาชิกอย่างน้อย 1 ระดับ','error');
    return;
  }

  if (levels.includes('ทุกระดับ') && levels.length > 1) {
    showMessage('หากเลือกทุกระดับ ไม่ต้องเลือกระดับอื่นซ้ำ','error');
    return;
  }

  const data = {
    name,
    description:document.getElementById('description').value,
    levels:levels.join(','),
    type:document.getElementById('type').value,
    value:document.getElementById('value').value,
    startDate:document.getElementById('startDate').value,
    endDate:document.getElementById('endDate').value,
    status:document.getElementById('status').value,
    sort:document.getElementById('sort').value,
    pin:STAFF_PIN_VALUE
  };

  if (id) data.privilegeId = id;

  const button = document.getElementById('saveButton');
  button.disabled = true;

  try {
    const action = id ? 'editPrivilege' : 'addPrivilege';

    const result = await api(action,data);

    showMessage(result.message || 'บันทึกสำเร็จ','success');

    resetForm();
    await loadPrivileges();

  } catch (error) {
    if (error.message.includes('PIN')) {
      STAFF_PIN_VALUE = '';
    }

    showMessage(error.message,'error');

  } finally {
    button.disabled = false;
  }
}

async function togglePrivilege(id) {
  if (!askPin()) return;

  const item = privileges.find(x =>
    String(x.privilegeId) === String(id)
  );

  if (!item) return;

  const newStatus =
    item.status === 'ใช้งาน' ? 'ปิดใช้งาน' : 'ใช้งาน';

  if (!confirm(
    'ต้องการ' + (newStatus === 'ใช้งาน' ? 'เปิด' : 'ปิด') +
    'สิทธิพิเศษนี้ใช่หรือไม่?'
  )) return;

  try {
    const result = await api('editPrivilege',{
      privilegeId:item.privilegeId,
      name:item.name,
      description:item.description || '',
      levels:item.levels,
      type:item.type || 'ทั่วไป',
      value:item.value || '',
      startDate:toInputDate(item.startDate),
      endDate:toInputDate(item.endDate),
      status:newStatus,
      sort:item.sort || 0,
      pin:STAFF_PIN_VALUE
    });

    showMessage(result.message,'success');
    await loadPrivileges();

  } catch (error) {
    if (error.message.includes('PIN')) STAFF_PIN_VALUE = '';
    showMessage(error.message,'error');
  }
}

async function removePrivilege(id) {
  if (!askPin()) return;

  if (!confirm('ยืนยันลบสิทธิพิเศษนี้ใช่หรือไม่?')) return;

  try {
    const result = await api('deletePrivilege',{
      privilegeId:id,
      pin:STAFF_PIN_VALUE
    });

    showMessage(result.message,'success');
    await loadPrivileges();

  } catch (error) {
    if (error.message.includes('PIN')) STAFF_PIN_VALUE = '';
    showMessage(error.message,'error');
  }
}

loadPrivileges();
</script>
