
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173f35">
<title>NICHA CRM | Coupon Management</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --green:#173f35;
  --green2:#245c4b;
  --gold:#c6a15b;
  --cream:#f8f6ef;
  --text:#26352f;
  --muted:#78847d;
  --border:#e8e5dc;
  --red:#b84b45;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:'Kanit',sans-serif;
  font-weight:300;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.page{
  max-width:1200px;
  margin:auto;
  padding:24px 16px 50px;
}
.header{
  background:linear-gradient(135deg,#173f35,#285c4b);
  color:white;
  border-radius:20px;
  padding:26px 24px;
  margin-bottom:22px;
  box-shadow:0 8px 25px #173f351c;
}
.brand{
  font-family:'Playfair Display',serif;
  letter-spacing:2px;
  color:#e3c783;
  font-size:27px;
}
.subtitle{
  font-size:13px;
  color:#d7e1db;
  margin-top:5px;
}
.header-line{
  height:1px;
  background:#ffffff35;
  margin:17px 0;
}
.header-bottom,.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.header-bottom{font-size:13px}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 20px #243b2e08;
}
.card-title{
  font-size:18px;
  font-weight:500;
  color:var(--green);
  margin:0 0 16px;
}
.gold-line{
  width:42px;
  height:3px;
  background:var(--gold);
  border-radius:4px;
  margin-top:-9px;
  margin-bottom:18px;
}
label{
  display:block;
  font-size:13px;
  color:#59665f;
  margin:0 0 6px;
}
input,select,textarea{
  width:100%;
  border:1px solid #dedfd8;
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px #c6a15b20;
}
textarea{min-height:75px;resize:vertical}
.field{margin-bottom:14px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.btn{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  font-weight:400;
  transition:.2s;
}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-green{background:var(--green);color:white}
.btn-green:hover{background:var(--green2)}
.btn-gold{background:var(--gold);color:#fff}
.btn-light{background:#edf2ee;color:var(--green)}
.btn-red{background:#f8e9e7;color:var(--red)}
.btn-small{
  padding:6px 11px;
  font-size:12px;
  border-radius:8px;
}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.status{
  font-size:13px;
  margin-top:10px;
  padding:9px 12px;
  border-radius:9px;
  display:none;
}
.status.success{display:block;background:#e8f4ec;color:#276443}
.status.error{display:block;background:#faeae8;color:#a53d38}
.status.info{display:block;background:#edf2f5;color:#426273}
.member-result{
  background:#f5f7f3;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  margin-top:12px;
  display:none;
  font-size:14px;
}
.member-option{
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.member-option:last-child{border-bottom:0}
.member-selected{
  border:1px solid #d9c18e;
  background:#fbf8ef;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
}
.member-name{font-weight:500;color:var(--green)}
.member-detail{font-size:12px;color:var(--muted)}
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}
th,td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  vertical-align:middle;
}
th{
  color:var(--green);
  font-weight:500;
  background:#f7f8f4;
}
.badge{
  display:inline-block;
  border-radius:20px;
  padding:4px 10px;
  font-size:11px;
  background:#e8f3eb;
  color:#286044;
  white-space:nowrap;
}
.badge.cancel{background:#f9e8e6;color:#a6443e}
.badge.expired{background:#f1eee7;color:#82765f}
.badge.pending{background:#fff3d9;color:#946719}
.badge.used{background:#e8e8e8;color:#555}
.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}
.footer{
  text-align:center;
  color:#9aa39d;
  font-size:11px;
  margin-top:25px;
}
@media(max-width:650px){
  .page{padding:14px 11px 35px}
  .header{padding:21px 18px}
  .card{padding:17px}
  .grid{grid-template-columns:1fr;gap:0}
  .brand{font-size:24px}
}
</style>
</head>

<body>
<div id="appArea">
<div class="page">

<div class="header">
  <div class="brand">NICHA CRM</div>
  <div class="subtitle">COUPON MANAGEMENT SYSTEM</div>
  <div class="header-line"></div>
  <div class="header-bottom">
    <span>ระบบจัดการคูปองส่วนลดสำหรับสมาชิก</span>
    <button class="btn btn-light btn-small" onclick="backToCenter()">กลับหน้ารวม</button>
  </div>
</div>

<div class="card">
  <h2 class="card-title">ค้นหาสมาชิก</h2>
  <div class="gold-line"></div>
  <div class="field">
    <label>เบอร์โทรศัพท์สมาชิก</label>
    <div class="grid" style="grid-template-columns:1fr auto">
      <input id="phone" type="tel" placeholder="กรอกเบอร์โทรศัพท์">
      <button class="btn btn-green" onclick="searchMember()">ค้นหา</button>
    </div>
  </div>
  <div id="searchStatus" class="status"></div>
  <div id="memberResult" class="member-result"></div>
</div>

<div class="card">
  <div class="top-actions">
    <h2 class="card-title" id="formTitle">สร้างคูปองให้สมาชิก</h2>
    <button class="btn btn-light btn-small" onclick="resetForm()">ล้างฟอร์ม</button>
  </div>
  <div class="gold-line"></div>

  <div id="selectedMemberBox" class="member-selected">
    <span style="color:var(--muted);font-size:13px">
      กรุณาค้นหาและเลือกสมาชิกก่อนสร้างคูปอง
    </span>
  </div>

  <div class="field" style="margin-top:17px">
    <label>ชื่อคูปอง</label>
    <input id="couponName" type="text" placeholder="เช่น ส่วนลดพิเศษ 100 บาท">
  </div>

  <div class="grid">
    <div class="field">
      <label>ประเภทส่วนลด</label>
      <select id="discountType">
        <option value="บาท">ลดเป็นจำนวนเงิน (บาท)</option>
        <option value="%">ลดเป็นเปอร์เซ็นต์ (%)</option>
      </select>
    </div>

    <div class="field">
      <label>มูลค่าส่วนลด</label>
      <input id="discountValue" type="number" min="0" step="0.01" placeholder="เช่น 100 หรือ 10">
    </div>

    <div class="field">
      <label>ยอดซื้อขั้นต่ำ (บาท)</label>
      <input id="minimumSpend" type="number" min="0" step="1" value="0">
    </div>

    <div class="field">
      <label>วันเริ่มต้นใช้คูปอง</label>
      <input id="startDate" type="date">
    </div>

    <div class="field">
      <label>วันหมดอายุ</label>
      <input id="expiryDate" type="date">
    </div>
  </div>

  <div class="field">
    <label>เงื่อนไขเพิ่มเติม</label>
    <textarea id="terms" placeholder="เช่น ใช้ได้กับทุกคอร์ส ไม่สามารถใช้ร่วมกับโปรโมชั่นอื่น"></textarea>
  </div>

  <div class="btn-row">
    <button class="btn btn-gold" id="saveBtn" onclick="saveCoupon()">บันทึกคูปอง</button>
    <button class="btn btn-light hidden" id="cancelEditBtn" onclick="resetForm()">ยกเลิกการแก้ไข</button>
  </div>
  <div id="formStatus" class="status"></div>
</div>

<div class="card">
  <div class="top-actions">
    <h2 class="card-title">รายการคูปองทั้งหมด</h2>
    <div class="btn-row">
      <button class="btn btn-gold btn-small" onclick="window.location.href='coupon-history.html'">ประวัติการใช้คูปอง</button>
      <button class="btn btn-green btn-small" onclick="loadCoupons()">รีเฟรชรายการ</button>
    </div>
  </div>

  <div class="gold-line"></div>
  <div id="listStatus" class="status"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>สมาชิก</th>
          <th>ชื่อคูปอง</th>
          <th>ส่วนลด</th>
          <th>ยอดขั้นต่ำ</th>
          <th>วันหมดอายุ</th>
          <th>สถานะ</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="couponTable">
        <tr><td colspan="7" class="empty">กำลังโหลดข้อมูล...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer">NICHA CRM • MEMBER PRIVILEGE MANAGEMENT</div>
</div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyTicniXNgmKtRavQPXdaJa8FWU05-_alup6V4A6Ikm5B1rxMDs8Bv4cj5G6ywPt0Pu0Q/exec';

let staffPin='';
let selectedMember=null;
let foundMembers=[];
let coupons=[];
let editingCouponId=null;

function backToCenter(){
  if(window.parent && window.parent!==window && typeof window.parent.backToMenu==='function'){
    window.parent.backToMenu();
  }else{
    window.location.href='staff-center.html';
  }
}

async function api(action,payload={}){
  const response=await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action,...payload})
  });

  const text=await response.text();
  let data;

  try{
    data=JSON.parse(text);
  }catch(e){
    throw new Error('เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ถูกต้อง');
  }

  if(!response.ok) throw new Error(data.message||'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
  if(data.success===false) throw new Error(data.message||'เกิดข้อผิดพลาด');

  return data;
}

function showStatus(id,message,type='info'){
  const el=document.getElementById(id);
  el.textContent=message;
  el.className='status '+type;
}

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,char=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[char]));
}

/* ตรวจสอบสถานะคูปอง */
function isUsedCoupon(status){
  const s=String(status??'').trim().toLowerCase();
  return ['ใช้แล้ว','used','redeemed'].includes(s);
}

async function searchMember(){
  const phone=document.getElementById('phone').value.trim();

  if(!phone){
    showStatus('searchStatus','กรุณากรอกเบอร์โทรศัพท์','error');
    return;
  }

  showStatus('searchStatus','กำลังค้นหาสมาชิก...');
  document.getElementById('memberResult').style.display='none';

  try{
    const data=await api('searchMember',{pin:staffPin,phone});
    foundMembers=Array.isArray(data.members)?data.members:[];

    if(!foundMembers.length){
      selectedMember=null;
      throw new Error('ไม่พบสมาชิกจากเบอร์โทรนี้');
    }

    if(foundMembers.length===1){
      selectMember(0);
    }else{
      selectedMember=null;

      document.getElementById('memberResult').innerHTML=
        '<strong>พบสมาชิก '+foundMembers.length+' รายการ</strong>'+
        foundMembers.map((m,i)=>`
          <div class="member-option">
            <div class="member-name">${escapeHtml(m.name)}</div>
            <div class="member-detail">
              เบอร์โทร: ${escapeHtml(m.phone)} · แต้ม: ${escapeHtml(m.points)}
            </div>
            <button class="btn btn-green btn-small" style="margin-top:8px"
              onclick="selectMember(${i})">เลือกสมาชิกนี้</button>
          </div>
        `).join('');

      document.getElementById('memberResult').style.display='block';
    }

    showStatus('searchStatus','ค้นหาสำเร็จ พบ '+foundMembers.length+' รายการ','success');

  }catch(e){
    selectedMember=null;
    showStatus('searchStatus',e.message,'error');
  }
}

function selectMember(i){
  const m=foundMembers[i];

  if(!m||!m.lineUserId){
    showStatus('searchStatus','ไม่พบ LINE User ID ของสมาชิก','error');
    return;
  }

  selectedMember={
    lineUserId:m.lineUserId,
    name:m.name,
    phone:m.phone,
    points:m.points
  };

  document.getElementById('memberResult').innerHTML=`
    <strong>เลือกสมาชิกแล้ว</strong><br>
    ชื่อ: ${escapeHtml(m.name)}<br>
    เบอร์โทร: ${escapeHtml(m.phone)}<br>
    แต้มสะสม: ${escapeHtml(m.points)}
  `;

  document.getElementById('memberResult').style.display='block';

  document.getElementById('selectedMemberBox').innerHTML=`
    <div class="member-name">${escapeHtml(m.name)}</div>
    <div class="member-detail">
      เบอร์โทร: ${escapeHtml(m.phone)}<br>
      LINE User ID: ${escapeHtml(m.lineUserId)}
    </div>
  `;

  showStatus('searchStatus','เลือกสมาชิกเรียบร้อยแล้ว','success');
}

function validateForm(){
  if(!selectedMember?.lineUserId) throw new Error('กรุณาค้นหาและเลือกสมาชิกก่อน');

  const name=document.getElementById('couponName').value.trim();
  const type=document.getElementById('discountType').value;
  const value=Number(document.getElementById('discountValue').value);
  const minimum=Number(document.getElementById('minimumSpend').value||0);
  const start=document.getElementById('startDate').value;
  const expiry=document.getElementById('expiryDate').value;

  if(!name) throw new Error('กรุณากรอกชื่อคูปอง');
  if(!Number.isFinite(value)||value<=0) throw new Error('กรุณากรอกมูลค่าส่วนลดให้ถูกต้อง');
  if(type==='%'&&value>100) throw new Error('ส่วนลดเปอร์เซ็นต์ต้องไม่เกิน 100%');
  if(!Number.isFinite(minimum)||minimum<0) throw new Error('ยอดซื้อขั้นต่ำไม่ถูกต้อง');
  if(!start||!expiry) throw new Error('กรุณากำหนดวันเริ่มต้นและวันหมดอายุ');
  if(expiry<start) throw new Error('วันหมดอายุต้องไม่ก่อนวันเริ่มต้น');

  return{
    lineUserId:selectedMember.lineUserId,
    name,
    discountType:type,
    discountValue:value,
    minimumSpend:minimum,
    startDate:start,
    expiryDate:expiry,
    condition:document.getElementById('terms').value.trim(),
    pin:staffPin
  };
}

async function saveCoupon(){
  const b=document.getElementById('saveBtn');

  try{
    const p=validateForm();
    b.disabled=true;
    b.textContent='กำลังบันทึก...';

    if(editingCouponId){
      p.couponId=editingCouponId;
      await api('editCoupon',p);
      showStatus('formStatus','แก้ไขคูปองเรียบร้อยแล้ว','success');
    }else{
      await api('createCoupon',p);
      showStatus('formStatus','สร้างคูปองเรียบร้อยแล้ว','success');
    }

    await loadCoupons();
    resetForm();

  }catch(e){
    showStatus('formStatus',e.message,'error');
  }finally{
    b.disabled=false;
    b.textContent=editingCouponId?'บันทึกการแก้ไข':'บันทึกคูปอง';
  }
}

async function loadCoupons(){
  showStatus('listStatus','กำลังโหลดรายการคูปอง...');

  try{
    const d=await api('getAllCoupons',{pin:staffPin});
    coupons=Array.isArray(d.coupons)?d.coupons:[];
    renderCoupons();
    document.getElementById('listStatus').className='status';

  }catch(e){
    showStatus('listStatus',e.message,'error');
    document.getElementById('couponTable').innerHTML=
      '<tr><td colspan="7" class="empty">ไม่สามารถโหลดข้อมูลได้</td></tr>';
  }
}

/* แสดงรายการคูปองและปุ่มจัดการ */
function renderCoupons(){
  const tbody=document.getElementById('couponTable');

  if(!coupons.length){
    tbody.innerHTML='<tr><td colspan="7" class="empty">ยังไม่มีรายการคูปอง</td></tr>';
    return;
  }

  tbody.innerHTML=coupons.map(c=>{
    const id=c.couponId||c['Coupon ID']||'';
    const member=c.memberName||c['ชื่อสมาชิก']||'-';
    const name=c.name||c['ชื่อคูปอง']||'-';
    const type=c.discountType||c['ประเภทส่วนลด']||'บาท';
    const value=c.discountValue??c['มูลค่าส่วนลด']??0;
    const minimum=c.minimumSpend??c['ยอดซื้อขั้นต่ำ']??0;
    const expiry=c.expiryDate||c['วันหมดอายุ']||'-';

    const rawStatus=c.status??c['สถานะ']??'';
    const used=isUsedCoupon(rawStatus);
    const status=used?'ใช้แล้ว':String(rawStatus).trim();

    let cls='';
    if(status==='ยกเลิก') cls='cancel';
    else if(status==='หมดอายุ') cls='expired';
    else if(status==='รอยืนยัน') cls='pending';
    else if(used) cls='used';

    const discount=type==='%'
      ?value+'%'
      :Number(value).toLocaleString('th-TH')+' บาท';

    const sid=escapeHtml(id);
    let actions='';

    if(used){
      actions=`
        <button class="btn btn-red btn-small"
          onclick="deleteUsedCoupon('${sid}',this)">
          🗑️ ลบคูปอง
        </button>
      `;
    }else if(status==='รอยืนยัน'){
      actions=`
        <button class="btn btn-gold btn-small"
          onclick="confirmCoupon('${sid}',this)">
          ยืนยันการใช้
        </button>
      `;
    }else{
      actions=`
        <div class="btn-row">
          <button class="btn btn-light btn-small"
            onclick="editCoupon('${sid}')">แก้ไข</button>
          <button class="btn btn-red btn-small"
            onclick="cancelCoupon('${sid}')">ยกเลิก</button>
        </div>
      `;
    }

    return`
      <tr>
        <td>${escapeHtml(member)}</td>
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(discount)}</td>
        <td>${Number(minimum).toLocaleString('th-TH')} บาท</td>
        <td>${escapeHtml(formatDate(expiry))}</td>
        <td><span class="badge ${cls}">${escapeHtml(status||'ใช้งาน')}</span></td>
        <td>${actions}</td>
      </tr>
    `;
  }).join('');
}

async function confirmCoupon(id,b){
  if(!id){
    alert('ไม่พบรหัสคูปอง');
    return;
  }

  if(!confirm('ยืนยันว่าลูกค้าใช้คูปองนี้แล้วใช่หรือไม่?')) return;

  try{
    if(b){
      b.disabled=true;
      b.textContent='กำลังยืนยัน...';
    }

    await api('confirmCouponUse',{pin:staffPin,couponId:id});
    showStatus('listStatus','ยืนยันการใช้คูปองเรียบร้อยแล้ว','success');
    await loadCoupons();

  }catch(e){
    showStatus('listStatus',e.message,'error');

    if(b){
      b.disabled=false;
      b.textContent='ยืนยันการใช้';
    }
  }
}

function editCoupon(id){
  const c=coupons.find(x=>String(x.couponId||x['Coupon ID']||'')===String(id));

  if(!c){
    alert('ไม่พบข้อมูลคูปอง');
    return;
  }

  selectedMember={
    lineUserId:c.lineUserId||c['LINE User ID']||'',
    name:c.memberName||c['ชื่อสมาชิก']||'',
    phone:''
  };

  editingCouponId=id;

  document.getElementById('selectedMemberBox').innerHTML=`
    <div class="member-name">${escapeHtml(selectedMember.name)}</div>
    <div class="member-detail">กำลังแก้ไขคูปองของสมาชิก</div>
  `;

  document.getElementById('couponName').value=c.name||c['ชื่อคูปอง']||'';
  document.getElementById('discountType').value=c.discountType||c['ประเภทส่วนลด']||'บาท';
  document.getElementById('discountValue').value=c.discountValue??c['มูลค่าส่วนลด']??'';
  document.getElementById('minimumSpend').value=c.minimumSpend??c['ยอดซื้อขั้นต่ำ']??0;
  document.getElementById('startDate').value=normalizeDate(c.startDate||c['วันเริ่มต้น']);
  document.getElementById('expiryDate').value=normalizeDate(c.expiryDate||c['วันหมดอายุ']);
  document.getElementById('terms').value=c.condition||c['เงื่อนไข']||'';

  document.getElementById('formTitle').textContent='แก้ไขคูปอง';
  document.getElementById('saveBtn').textContent='บันทึกการแก้ไข';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('formStatus').className='status';

  window.scrollTo({top:0,behavior:'smooth'});
}

function normalizeDate(v){
  if(!v) return '';

  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return '';

  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function cancelCoupon(id){
  const c=coupons.find(x=>String(x.couponId||x['Coupon ID']||'')===String(id));

  if(!c){
    alert('ไม่พบข้อมูลคูปอง');
    return;
  }

  const name=c.name||c['ชื่อคูปอง']||'';

  if(!confirm('ต้องการยกเลิกคูปอง "'+name+'" ใช่หรือไม่?')) return;

  try{
    await api('cancelCoupon',{pin:staffPin,couponId:id});
    showStatus('listStatus','ยกเลิกคูปองเรียบร้อยแล้ว','success');
    await loadCoupons();
  }catch(e){
    showStatus('listStatus',e.message,'error');
  }
}

/* ลบเฉพาะคูปองที่ใช้แล้ว */
async function deleteUsedCoupon(id,b){
  const c=coupons.find(x=>String(x.couponId||x['Coupon ID']||'')===String(id));

  if(!c){
    alert('ไม่พบข้อมูลคูปอง');
    return;
  }

  if(!isUsedCoupon(c.status??c['สถานะ'])){
    alert('ลบได้เฉพาะคูปองที่ใช้แล้วเท่านั้น');
    return;
  }

  const name=c.name||c['ชื่อคูปอง']||'';

  if(!confirm(
    'ต้องการลบคูปอง "'+name+'" ใช่หรือไม่?\n\n'+
    'ข้อมูลคูปองจะถูกลบออก แต่ประวัติการใช้คูปองจะยังคงเก็บไว้'
  )) return;

  try{
    if(b){
      b.disabled=true;
      b.textContent='กำลังลบ...';
    }

    await api('deleteUsedCoupon',{
      pin:staffPin,
      couponId:id
    });

    showStatus('listStatus','ลบคูปองเรียบร้อยแล้ว โดยเก็บประวัติไว้','success');
    await loadCoupons();

  }catch(e){
    showStatus('listStatus',e.message,'error');

    if(b){
      b.disabled=false;
      b.textContent='🗑️ ลบคูปอง';
    }
  }
}

function resetForm(){
  editingCouponId=null;

  document.getElementById('couponName').value='';
  document.getElementById('discountType').value='บาท';
  document.getElementById('discountValue').value='';
  document.getElementById('minimumSpend').value='0';
  document.getElementById('startDate').value='';
  document.getElementById('expiryDate').value='';
  document.getElementById('terms').value='';

  document.getElementById('formTitle').textContent='สร้างคูปองให้สมาชิก';
  document.getElementById('saveBtn').textContent='บันทึกคูปอง';
  document.getElementById('cancelEditBtn').classList.add('hidden');
  document.getElementById('formStatus').className='status';

  selectedMember=null;

  document.getElementById('selectedMemberBox').innerHTML=`
    <span style="color:var(--muted);font-size:13px">
      กรุณาค้นหาและเลือกสมาชิกก่อนสร้างคูปอง
    </span>
  `;
}

function formatDate(v){
  if(!v||v==='-') return '-';

  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return String(v);

  return d.toLocaleDateString('th-TH');
}

document.getElementById('phone').addEventListener('keydown',e=>{
  if(e.key==='Enter') searchMember();
});

function initializeCouponPage(){
  staffPin=sessionStorage.getItem('NICHA_STAFF_PIN')||'';

  if(!staffPin){
    window.top.location.href='staff-center.html';
    return;
  }

  loadCoupons();
}

initializeCouponPage();
