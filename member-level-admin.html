
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>NICHA CRM | กำหนดระดับสมาชิก</title>

<style>
:root {
  --green:#123d32;
  --green2:#1d5143;
  --gold:#c9a45c;
  --bg:#f5f3ed;
  --white:#fff;
  --text:#26352e;
  --muted:#78847d;
  --border:#e5e8e3;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Tahoma",sans-serif;
}
.container {
  max-width:650px;
  margin:auto;
}
.header {
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:white;
  padding:24px;
  border-radius:18px;
  margin-bottom:20px;
}
.header h2 { margin:0 0 8px; }
.header p { margin:0; color:#e1e9e3; font-size:14px; }
.card {
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
}
.card h3 { margin:0 0 16px; color:var(--green); }
.level {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.level:last-child { border-bottom:0; }
.level-name {
  width:115px;
  font-weight:bold;
}
.level-input { flex:1; }
input {
  width:100%;
  padding:12px;
  border:1px solid #dce2dc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}
input:focus { border-color:var(--gold); }
.unit {
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}
button {
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.save {
  background:var(--green);
  color:white;
}
.save:disabled { opacity:.6; cursor:wait; }
.message {
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-size:14px;
}
.success { display:block; background:#e8f4eb; color:#24643b; }
.error { display:block; background:#fff0ed; color:#a33c2d; }
.note {
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
.loading { text-align:center; padding:20px; color:var(--muted); }
@media(max-width:480px) {
  body { padding:12px; }
  .level { gap:8px; }
  .level-name { width:90px; font-size:14px; }
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>ตั้งค่าระดับสมาชิก</h2>
    <p>NICHA CRM · Member Level Management</p>
  </div>

  <div class="card">
    <h3>กำหนดคะแนนเลื่อนระดับ</h3>

    <div id="levelList" class="loading">
      กำลังโหลดข้อมูลระดับสมาชิก...
    </div>

    <p class="note">
      กำหนดคะแนนสะสมตลอดชีพที่สมาชิกต้องมีเพื่อเลื่อนระดับ
      ระบบจะคำนวณระดับสมาชิกใหม่ตามคะแนนสะสมโดยอัตโนมัติ
    </p>
  </div>

  <div class="card">
    <h3>บันทึกการตั้งค่า</h3>
    <button id="saveBtn" class="save" onclick="saveLevels()">
      บันทึกระดับสมาชิก
    </button>
    <div id="message" class="message"></div>
  </div>

</div>

<script>
/*
  เปลี่ยน URL นี้เป็น URL เว็บแอป Apps Script
  ที่ระบบ NICHA CRM ใช้งานจริง
*/
const API_URL = 'ใส่_URL_APPS_SCRIPT_ของระบบคุณ';

let levels = [];

function getPin() {
  return sessionStorage.getItem('NICHA_STAFF_PIN') || '';
}

function showMessage(message, type) {
  const box = document.getElementById('message');
  box.textContent = message;
  box.className = 'message ' + type;
}

async function api(action, data = {}) {
  const response = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: action,
      pin: getPin(),
      ...data
    })
  });

  return await response.json();
}

function renderLevels() {
  const list = document.getElementById('levelList');

  if (!levels.length) {
    list.textContent = 'ไม่พบข้อมูลระดับสมาชิก';
    return;
  }

  list.innerHTML = '';

  levels.forEach((level, index) => {
    const row = document.createElement('div');
    row.className = 'level';

    const name = document.createElement('div');
    name.className = 'level-name';
    name.textContent = level.name;

    const wrapper = document.createElement('div');
    wrapper.className = 'level-input';

    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.step = '1';
    input.value = level.min;
    input.id = 'level-' + index;

    const unit = document.createElement('div');
    unit.className = 'unit';
    unit.textContent = 'คะแนนสะสมตลอดชีพ';

    wrapper.appendChild(input);
    wrapper.appendChild(unit);
    row.appendChild(name);
    row.appendChild(wrapper);
    list.appendChild(row);
  });
}

async function loadLevels() {
  try {
    const result = await api('getLevelSettings');

    if (!result.success) {
      throw new Error(result.message || 'โหลดข้อมูลไม่สำเร็จ');
    }

    levels = result.levels || [];
    renderLevels();

  } catch (error) {
    document.getElementById('levelList').textContent =
      'โหลดข้อมูลไม่สำเร็จ: ' + error.message;
  }
}

async function saveLevels() {
  const button = document.getElementById('saveBtn');

  const updatedLevels = levels.map((level, index) => ({
    name: level.name,
    min: Number(document.getElementById('level-' + index).value)
  }));

  if (updatedLevels.some(level =>
    !Number.isInteger(level.min) || level.min < 0
  )) {
    showMessage('กรุณากรอกคะแนนเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป', 'error');
    return;
  }

  for (let i = 1; i < updatedLevels.length; i++) {
    if (updatedLevels[i].min <= updatedLevels[i - 1].min) {
      showMessage('คะแนนของแต่ละระดับต้องเพิ่มขึ้นตามลำดับ', 'error');
      return;
    }
  }

  button.disabled = true;
  button.textContent = 'กำลังบันทึก...';

  try {
    const result = await api('saveLevelSettings', {
      levels: updatedLevels
    });

    if (!result.success) {
      throw new Error(result.message || 'บันทึกไม่สำเร็จ');
    }

    levels = updatedLevels;
    showMessage('บันทึกระดับสมาชิกเรียบร้อยแล้ว', 'success');

  } catch (error) {
    showMessage(error.message, 'error');
  } finally {
    button.disabled = false;
    button.textContent = 'บันทึกระดับสมาชิก';
  }
}

loadLevels();
</script>
</body>
</html>
