<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d32">
<title>NICHA CRM | จัดการสมาชิก</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#f1f7f2;
  color:#244333;
  font-family:Arial,sans-serif;
}
.container{max-width:1100px;margin:auto}
.header{
  background:#123d32;
  color:white;
  padding:22px;
  border-radius:16px;
  margin-bottom:18px;
}
.header h2{margin:0 0 8px}
.card{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0000000b;
}
input{
  width:100%;
  padding:13px;
  border:1px solid #ccd9cf;
  border-radius:9px;
  font-size:15px;
}
button{
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.refresh{background:#28734b;color:white}
.disable{background:#ffe5e5;color:#a32626}
.enable{background:#dff5e5;color:#176b38}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{
  padding:12px 9px;
  border-bottom:1px solid #e5ece6;
  text-align:left;
  font-size:14px;
}
th{background:#edf5ee}
.table-wrap{overflow-x:auto}
.status{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.active{background:#dcf5e3;color:#176b38}
.inactive{background:#ffe1e1;color:#a32626}
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.summary div{
  background:#edf5ee;
  padding:15px;
  border-radius:10px;
}
.summary strong{display:block;font-size:23px;margin-top:5px}
#message{margin:12px 0;color:#28734b}
@media(max-width:600px){
  body{padding:10px}
  .summary{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h2>NICHA CRM</h2>
  <div>ระบบจัดการข้อมูลสมาชิก</div>
</div>

<div class="card">
  <div class="summary">
    <div>สมาชิกทั้งหมด<strong id="total">0</strong></div>
    <div>เปิดใช้งาน<strong id="activeTotal">0</strong></div>
    <div>ปิดใช้งาน<strong id="inactiveTotal">0</strong></div>
  </div>
</div>

<div class="card">
  <input id="search" placeholder="ค้นหาชื่อ เบอร์โทร หรือ LINE User ID">
  <br><br>
  <button class="refresh" onclick="loadMembers()">รีเฟรชข้อมูล</button>
  <div id="message">กำลังเตรียมระบบ...</div>
</div>

<div class="card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ลำดับ</th>
          <th>ชื่อสมาชิก</th>
          <th>เบอร์โทร</th>
          <th>แต้มคงเหลือ</th>
          <th>แต้มสะสม</th>
          <th>ระดับสมาชิก</th>
          <th>สถานะ</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="memberList">
        <tr><td colspan="8">กำลังโหลดข้อมูล...</td></tr>
      </tbody>
    </table>
  </div>
</div>

</div>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbyTicniXNgmKtRavQPXdaJa8FWU05-_alup6V4A6Ikm5B1rxMDs8Bv4cj5G6ywPt0Pu0Q/exec';

let members = [];

function getPIN(){
  return sessionStorage.getItem('NICHA_STAFF_PIN') || '';
}

async function api(action, params={}){
  const pin = getPIN();

  if(!pin){
    throw new Error('กรุณาเข้าสู่ระบบพนักงานก่อน');
  }

  const response = await fetch(API_URL,{
    method:'POST',
    headers:{
      'Content-Type':'text/plain;charset=utf-8'
    },
    body:JSON.stringify({
      action:action,
      pin:pin,
      ...params
    })
  });

  return await response.json();
}

function showMessage(text){
  document.getElementById('message').textContent=text;
}

async function loadMembers(){
  showMessage('กำลังโหลดข้อมูลสมาชิก...');

  try{
    const result = await api('getAllMembersAdmin');

    if(!result || result.success === false){
      throw new Error(result?.message || 'ไม่สามารถโหลดข้อมูลได้');
    }

    members = result.members || result.data || [];

    renderMembers();
    showMessage('โหลดข้อมูลเรียบร้อย');

  }catch(error){
    showMessage(error.message);
    document.getElementById('memberList').innerHTML =
      '<tr><td colspan="8">'+escapeHTML(error.message)+'</td></tr>';
  }
}

function renderMembers(){
  const keyword =
    document.getElementById('search').value.toLowerCase().trim();

  const filtered = members.filter(m=>{
    const text = [
      m.name,m.phone,m.lineUserId
    ].join(' ').toLowerCase();

    return text.includes(keyword);
  });

  const active = members.filter(m=>isActive(m)).length;
  const inactive = members.length-active;

  document.getElementById('total').textContent=members.length;
  document.getElementById('activeTotal').textContent=active;
  document.getElementById('inactiveTotal').textContent=inactive;

  const tbody=document.getElementById('memberList');

  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="8">ไม่พบข้อมูลสมาชิก</td></tr>';
    return;
  }

  tbody.innerHTML=filtered.map((m,index)=>{
    const enabled=isActive(m);
    const lineId=m.lineUserId || m.lineUserID || '';

    return `
      <tr>
        <td>${index+1}</td>
        <td>${escapeHTML(m.name || '-')}</td>
        <td>${escapeHTML(m.phone || '-')}</td>
        <td>${Number(m.remainingPoints || 0).toLocaleString()}</td>
        <td>${Number(m.lifetimePoints || 0).toLocaleString()}</td>
        <td>${escapeHTML(m.level || '-')}</td>
        <td>
          <span class="status ${enabled?'active':'inactive'}">
            ${enabled?'เปิดใช้งาน':'ปิดใช้งาน'}
          </span>
        </td>
        <td>
          <button
            class="${enabled?'disable':'enable'}"
            onclick="changeStatus('${encodeURIComponent(lineId)}',${enabled})">
            ${enabled?'ปิดสมาชิก':'เปิดสมาชิก'}
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

function isActive(m){
  const status=String(m.status || m.memberStatus || 'เปิดใช้งาน')
    .toLowerCase();

  return !['ปิดใช้งาน','ปิด','inactive','disabled','false','0']
    .includes(status);
}

async function changeStatus(encodedId, currentlyActive){
  const lineUserId=decodeURIComponent(encodedId);

  if(!lineUserId){
    alert('ไม่พบ LINE User ID ของสมาชิก');
    return;
  }

  const actionText=currentlyActive?'ปิดใช้งาน':'เปิดใช้งาน';

  if(!confirm('ยืนยัน'+actionText+'สมาชิกคนนี้หรือไม่?')){
    return;
  }

  showMessage('กำลังบันทึกสถานะ...');

  try{
    const result=await api('setMemberStatus',{
      lineUserId:lineUserId,
      status:currentlyActive?'ปิดใช้งาน':'เปิดใช้งาน',
      active:!currentlyActive
    });

    if(result && result.success===false){
      throw new Error(result.message || 'บันทึกไม่สำเร็จ');
    }

    alert('บันทึกสถานะเรียบร้อย');
    await loadMembers();

  }catch(error){
    alert(error.message);
    showMessage(error.message);
  }
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g,char=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

document.getElementById('search')
  .addEventListener('input',renderMembers);

loadMembers();
</script>

</body>
</html>
